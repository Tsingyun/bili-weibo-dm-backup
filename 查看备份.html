<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>私信备份</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --text:#1f2329; --muted:#8b939c; --line:#e6e9ee;
  --peer:#ffffff; --peer-text:#1f2329; --me:linear-gradient(135deg,#4f7cff,#7b5cff); --me-text:#fff;
  --accent:#4f7cff; --chip:#eef1f6; --chip-on:#4f7cff; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
  --mark:#ffe58a;
  --c-me:#4f7cff; --c-peer:#e8507a;
  /* 链接文字色：要与底色有足够对比度（原来的 #4f7cff 在浅灰底上只有 ~2.9:1） */
  --link:#1d4ed8; --link-ink:#1b3a9e;
  /* 比 --muted 再深一档的「弱化但仍读得清」文字色。
     --muted(#8b939c) 落在浅底(#f4f6f9)上只有 2.87:1 —— 做装饰性的次要文字没问题，
     但凡是要人读的正文（比如「这条消息已隐藏」占位条）就得用这个：5.4:1。
     别再往 --muted 上写正文，量过对比度会打脸（2026-09-16 被 shot_hide.mjs 抓到）。 */
  --muted-strong:#5f666e;
}
html[data-theme="dark"]{
  --bg:#101216; --panel:#191c21; --text:#e7eaee; --muted:#828a95; --line:#262a31;
  --peer:#20242a; --peer-text:#e7eaee; --me:linear-gradient(135deg,#3a5fd0,#5a45c9); --me-text:#fff;
  --accent:#6f92ff; --chip:#22262d; --chip-on:#4f7cff; --shadow:0 1px 2px rgba(0,0,0,.3);
  --mark:#7a6412;
  --c-me:#6f92ff; --c-peer:#ff7ba1;
  --link:#9db9ff; --link-ink:#1b3a9e;
  --muted-strong:#a3abb6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}

/* ---------- 三栏骨架：左状态栏 · 中聊天 · 右时间轴 ---------- */
.layout{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}

/* ---------- 左侧常驻状态栏 ---------- */
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;z-index:50;
  display:flex;flex-direction:column;gap:16px;padding:18px 16px;
  background:var(--panel);border-right:1px solid var(--line);
}
/* ---------- 顶部数据源切换（微博 / B站）---------- */
.srcsw{display:flex;gap:4px;padding:4px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);margin-bottom:11px}
.srcsw button{flex:1;min-width:0;height:31px;border:0;border-radius:8px;background:transparent;
  color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden}
.srcsw button[aria-pressed="true"]{background:var(--chip-on);color:#fff}
.srcsw button:disabled{opacity:.45;cursor:not-allowed}
.srcsw button[data-empty]{opacity:.55}
.srcsw button .n{font-weight:400;font-size:11px;opacity:.8}
/* ---------- B站卡片（分享视频/专栏/动态/推送/通知）---------- */
.wcard.bc{border-color:color-mix(in srgb, var(--c-peer) 42%, var(--line))}
.wcard.bc .wcard-h{color:var(--c-peer)}
.wcard.bc .wcard-h .wa{font-weight:500;opacity:.85}
.wcard-t.wtitle{font-weight:600}
.side-top{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);
}
.iconbtn{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;
  height:30px;padding:0 10px;cursor:pointer;font-size:12.5px;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn.wide{width:100%;height:32px}
.stats{font-size:12px;color:var(--muted);line-height:1.75}
.stats span{display:block}
.stats b{color:var(--text);font-weight:600}
.side-sec{display:flex;flex-direction:column;gap:8px}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:.7px;color:var(--muted);opacity:.75}
.search{position:relative;display:flex;align-items:center}
.search input{
  width:100%;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
  color:var(--text);padding:0 32px;font-size:13px;font-family:inherit;outline:none;
}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.search .ico{position:absolute;left:10px;color:var(--muted);font-size:13px;pointer-events:none}
.search .clr{position:absolute;right:6px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:4px 6px;display:none}
.hitrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.found{font-size:11.5px;color:var(--muted);line-height:1.5}
/* 上下文提示行：里面写着「怎么恢复被隐藏的消息」，是要人读的说明文字，
   所以用 --muted-strong 并且不再叠 opacity（叠加等于又把对比度打回去）。
   原来 --muted + .85 在浅底上约 2.4:1，属于"看得见但费劲"。 */
.searchhint{display:none;margin-top:6px;font-size:11px;line-height:1.5;color:var(--muted-strong)}
/* 换日规则提示：是要人读的正文 → --muted-strong（--muted 在浅底只有 2.87:1） */
.hintline{margin-top:6px;font-size:11px;line-height:1.55;color:var(--muted-strong)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;
  height:32px;padding:0 8px;font-size:12.5px;font-family:inherit;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.full{grid-column:1 / -1}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:#fff;font-weight:600}
input[type=date]{
  width:100%;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);padding:0 9px;font-size:12.5px;font-family:inherit;outline:none;
}
input[type=date]:focus{border-color:var(--accent)}
.side-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;padding-top:6px}

/* ---------- 右侧月份时间轴（宽屏才显示） ---------- */
.rail{
  display:none;position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  flex-direction:column;gap:5px;padding:18px 12px;
  background:var(--panel);border-left:1px solid var(--line);
}
.rail .sec-t{padding:0 9px 4px}
#months{display:flex;flex-direction:column;gap:4px}
.mo{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 9px;
  border-radius:8px;cursor:pointer;color:var(--muted);font-size:12px;white-space:nowrap;
  user-select:none;
}
.mo:hover{background:var(--bg);color:var(--text)}
.mo.on{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-weight:600}
.mo i{font-style:normal;font-size:10.5px;opacity:.65}

/* ---------- 聊天区 ---------- */
main{width:100%;max-width:1000px;margin:0 auto;padding:22px 28px 110px}
/* 分隔条上的日期是要人读的正文：用 --muted-strong（--muted 在白底药丸上只有 3.1:1）。
   这里只改字色，横线是 .day::before/::after 用 var(--line) 画的，不受影响。 */
.day{display:flex;align-items:center;gap:10px;margin:22px 0 14px;color:var(--muted-strong);font-size:12px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day span{padding:2px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.msg{display:flex;gap:9px;margin:11px 0;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.av{
  width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:var(--chip);
  border:1px solid var(--line);
}
.av-fb{
  width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--chip);color:var(--muted);font-size:13px;font-weight:700;border:1px solid var(--line);
}
.body{max-width:min(70%,620px);display:flex;flex-direction:column;gap:4px}
.msg.me .body{align-items:flex-end}
.meta{font-size:11px;color:var(--muted);padding:0 4px;display:flex;gap:7px;align-items:center}
.bubble{
  background:var(--peer);color:var(--peer-text);border:1px solid var(--line);border-radius:14px;
  padding:8px 12px;box-shadow:var(--shadow);word-break:break-word;white-space:pre-wrap;
  border-top-left-radius:5px;
}
.msg.me .bubble{
  background:var(--me);color:var(--me-text);border:0;border-top-right-radius:5px;border-top-left-radius:14px;
}
.bubble.plain{padding:0;background:transparent!important;border:0!important;box-shadow:none!important}
.bubble.sys{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12.5px;box-shadow:none}
/* 透明气泡（.plain = 只有图/卡片没有文字，.sys = 系统提示）**没有**紫渐变底，
   所以不能再沿用「我方 = 白字」那套：白字会直接落在浅色页面上，彻底看不见
   （实测分享卡片正好命中这条路径：有封面图 + 无文字 → .plain → 链接与标题全白）。
   这里把字色还原成正常正文色；带底的紫渐变气泡照旧用白字。 */
.msg.me .bubble.plain{color:var(--text)}
.msg.me .bubble.sys{color:var(--muted)}

/* 「已隐藏」占位条：**故意不用 .bubble 类** —— 它不是气泡，没有底色，
   也就不会撞上「我方 = 白字」那套只对画了底的气泡成立的装饰（.plain 的前车之鉴）。
   字色用 --muted-strong 而不是 --muted：这是要人读的正文，
   --muted 在浅底上只有 2.87:1（实测，被 shot_hide.mjs 的对比度断言抓到过）。 */
.hidb{
  display:inline-flex;align-items:center;gap:8px;padding:4px 10px;max-width:100%;
  border:1px dashed var(--line);border-radius:10px;
  background:transparent!important;box-shadow:none!important;
  color:var(--muted-strong);font-size:12.5px;line-height:1.6;cursor:pointer;
}
.hidb:hover{border-color:var(--accent);color:var(--text)}
/* 我方那一侧也只是换了个位置，字色必须显式写死：
   .msg.me .bubble{color:var(--me-text)} 的白字是给紫渐变底准备的，这里没有底。 */
.msg.me .hidb{color:var(--muted-strong)}
.msg.me .hidb:hover{color:var(--text)}
.hidb .hbtn{
  border:0;background:none;color:var(--link);font:inherit;font-size:12.5px;
  cursor:pointer;padding:0 2px;text-decoration:underline;
}
.hidb .hbtn:hover{color:var(--accent)}
.mutedph{opacity:.72}

/* 右键菜单 */
.cmenu{
  position:fixed;z-index:70;min-width:158px;padding:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
}
.cmenu[hidden]{display:none}
.cmenu button{
  display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);
  font:inherit;font-size:12.5px;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;
}
.cmenu button:hover{background:var(--chip);color:var(--accent)}
.cmenu button:disabled{opacity:.45;cursor:default}
.cmenu .sep{height:1px;background:var(--line);margin:4px 6px}

/* 轻提示（单例，挂在 body 上） */
.toast{
  position:fixed;left:50%;bottom:26px;z-index:80;
  transform:translateX(-50%) translateY(8px);
  background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-size:12.5px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 隐藏按钮只在有隐藏项时出现（.chip 没有显式 display，这里显式兜一层） */
.chip[hidden]{display:none!important}

.imgs{display:flex;flex-wrap:wrap;gap:6px}
.imgs img{
  max-width:240px;max-height:240px;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;
  background:var(--panel);display:block;
}
.imgs img.emoji{max-width:130px;max-height:130px;border-radius:8px;background:transparent;border:0}
/* 原图失效（备份时就 404，本地也没落盘）时的占位 */
.imgdead{
  display:inline-flex;align-items:center;justify-content:center;min-width:112px;height:68px;
  padding:0 12px;border:1px dashed var(--line);border-radius:12px;
  background:var(--bg);color:var(--muted);font-size:12px;
}
/* 图内文字（OCR）命中时的展示 */
.imgwrap{display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:240px}
.ocrtip{
  font-size:11.5px;line-height:1.45;color:var(--muted);background:var(--bg);
  border:1px solid var(--line);padding:3px 8px;border-radius:7px;
  max-width:100%;word-break:break-word;
}
.imgs img.ocrhit{outline:2px solid var(--c-me);outline-offset:1px}
.imgs img.vlmhit{outline:2px solid var(--c-peer);outline-offset:1px}
/* 以下「我方 = 半透明白 + 白字」的装饰只对**真正画了紫渐变底**的气泡生效；
   透明气泡（.plain / .sys）走上面的基础样式，否则浅色主题下就是白字白底。 */
.msg.me .bubble:not(.plain):not(.sys) .ocrtip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24);color:rgba(255,255,255,.92)}
.msg.me .bubble:not(.plain):not(.sys) .ocrtip mark{background:rgba(255,255,255,.42);color:#123}
.recalled{font-style:italic;opacity:.7}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* 链接 / 卡片 / 视频 */
.links{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:12.5px}
.links a{
  display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:5px 9px;border-radius:8px;background:rgba(127,127,127,.10);color:var(--link);text-decoration:none;
}
/* 正文里的链接胶囊不用「白字压半透明白底」（对比度仅 ~2.3:1，看不清），
   我方带底气泡上一律改成白底 + 深蓝字 */
.msg.me .bubble:not(.plain):not(.sys) .links a{background:rgba(255,255,255,.94);color:var(--link-ink)}
.card{
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:6px;background:var(--panel);
  display:flex;flex-direction:column;gap:5px;max-width:100%;
}
.card-h{font-size:12px;font-weight:700;opacity:.85}
.card-t{font-size:12.5px;opacity:.9;white-space:pre-wrap;max-height:9em;overflow:auto}
.card-u{font-size:11.5px;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 内联表情：官方微博表情图（原图 96×96 / 20×20，这里统一缩到 1.4em 跟随文字） */
.face{
  height:1.4em;width:auto;vertical-align:-0.26em;margin:0 1px;
  display:inline-block;border-radius:3px;
}
/* 正文里的网址：可点击，避免与下方链接区重复 */
.txtlink{color:inherit;text-decoration:underline;text-underline-offset:2px;word-break:break-all}
/* 分享微博卡片 */
.wcard{
  border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-top:6px;
  background:rgba(127,127,127,.05);display:flex;flex-direction:column;gap:5px;max-width:100%;
}
.msg.me .bubble:not(.plain):not(.sys) .wcard{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25)}
.wcard-h{font-size:12px;font-weight:700;opacity:.92;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.wcard-h .wt{font-weight:400;opacity:.6;font-size:11px}
.wcard-t{font-size:12.5px;line-height:1.55;opacity:.92;white-space:pre-wrap;word-break:break-word}
.wcard-btn{
  align-self:flex-start;border:1px solid var(--line);background:transparent;color:inherit;
  border-radius:999px;font-size:11.5px;padding:2px 11px;cursor:pointer;font-family:inherit;
  opacity:.75;line-height:1.7;
}
.wcard-btn:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.msg.me .bubble:not(.plain):not(.sys) .wcard-btn{border-color:rgba(255,255,255,.4)}
/* 折叠态：卡片默认只露摘要两行 + 小图，点「展开详情」看全部 */
.bubble.has-card:not(.open) .wcard-t{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.bubble.has-card:not(.open) .imgs img{max-height:108px;max-width:108px;border-radius:9px}
.wcard-link{
  align-self:flex-start;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:999px;background:rgba(127,127,127,.12);color:var(--link);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wcard-link:hover{text-decoration:underline}
/* 我方紫渐变气泡上：改用「白底药丸 + 深蓝字」。
   原先是半透明白底 + 白字，实测对比度只有 ~2.3:1，基本看不清。 */
.msg.me .bubble:not(.plain):not(.sys) .wcard-link{background:rgba(255,255,255,.94);color:var(--link-ink)}
/* 搜索导航 */
.hitnav{display:none;align-items:center;gap:4px}
.hitnav.on{display:inline-flex}
.hitnav button{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;
  width:26px;height:30px;cursor:pointer;font-size:12px;line-height:1;
}
.hitnav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.hitnav button:disabled{opacity:.35;cursor:default}
.hitnav .pos{font-size:12px;color:var(--muted);min-width:44px;text-align:center}
.tag{
  display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;
  background:rgba(127,127,127,.14);opacity:.85;margin-bottom:2px;
}
.msg.me .bubble:not(.plain):not(.sys) .tag{background:rgba(255,255,255,.2)}
.vid{font-size:12.5px;opacity:.85;margin-top:4px}

/* 加载更多 */
.more{display:flex;justify-content:center;margin:16px 0}
.more button{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;
  height:32px;padding:0 18px;cursor:pointer;font-size:12.5px;
}
.more button:hover{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:13px}

/* 悬浮按钮：宽屏用左栏底部按钮，窄屏（状态栏在顶部）才浮出来 */
.fab{display:none}
.fab button{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--text);cursor:pointer;box-shadow:var(--shadow);font-size:15px;
}
.fab button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- 互动统计面板（按天折线图） ---------- */
#stat{
  position:fixed;inset:0;z-index:180;display:none;align-items:center;justify-content:center;
  background:rgba(10,12,16,.55);padding:22px;
}
#stat.on{display:flex}
.statbox{
  width:min(1120px,96vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  display:flex;flex-direction:column;
}
.stat-h{
  display:flex;align-items:center;gap:10px;padding:14px 20px 12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel);z-index:2;
}
.stat-h h2{margin:0;font-size:15px;font-weight:700;flex:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stat-h h2 em{font-style:normal;font-size:11.5px;font-weight:400;color:var(--muted)}
.stat-body{padding:15px 20px 20px;display:flex;flex-direction:column;gap:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--bg);min-width:0}
.kpi b{display:block;font-size:20px;line-height:1.3;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi b i{font-style:normal;font-size:11.5px;color:var(--muted);margin-left:3px;font-weight:400}
.kpi span{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.me b{color:var(--c-me)} .kpi.peer b{color:var(--c-peer)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{
  border:0;background:var(--panel);color:var(--muted);font:inherit;font-size:12.5px;
  padding:0 12px;height:30px;cursor:pointer;white-space:nowrap;
}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:#fff;font-weight:600}
.tog{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;
  height:30px;padding:0 11px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.tog:hover{border-color:var(--accent);color:var(--accent)}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;margin-left:auto;white-space:nowrap}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chartwrap{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:6px}
#chart{display:block;max-width:100%}
#tip{
  position:absolute;pointer-events:none;z-index:3;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;
  display:none;line-height:1.7;font-variant-numeric:tabular-nums;
}
#tip.on{display:block}
#tip b{font-variant-numeric:tabular-nums}
#tip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chart-hint{display:none;font-size:12px;color:var(--muted-strong);line-height:1.65;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px}
.chart-hint.on{display:block}
/* 换日规则的附带说明：同一套配色，用虚线分隔，不做降低不透明度的处理
   （叠 opacity 会把本来刚够的对比度又压下去，见 .mutedph 那次的教训） */
.cutnote{display:block;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.caliber{font-size:12px;color:var(--muted);line-height:1.75;border:1px dashed var(--line);border-radius:11px;padding:10px 13px}
.caliber summary{cursor:pointer;color:var(--text);font-weight:600;font-size:12.5px;outline:none}
.caliber ul{margin:7px 0 0;padding-left:17px}
.caliber li{margin:3px 0}
.caliber code{background:var(--chip);border-radius:4px;padding:1px 5px;font-size:11.5px;font-family:ui-monospace,Consolas,monospace}
.caliber .em{color:var(--text);font-weight:600}
@media (max-width:760px){
  #stat{padding:8px;align-items:flex-start}
  .statbox{max-height:96vh;width:100%}
  .stat-body{padding:12px 12px 18px;gap:10px}
  .stat-h{padding:11px 13px 10px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi b{font-size:17px}
  .legend{margin-left:0;order:9;width:100%}
}

/* 灯箱 */
#lb{
  position:fixed;inset:0;z-index:200;background:rgba(10,12,16,.9);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:26px;
}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:80vh;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#lb .bar{display:flex;gap:10px;align-items:center;color:#dfe4ea;font-size:12.5px}
#lb .bar a,#lb .bar button{
  background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 12px;
  cursor:pointer;text-decoration:none;font-size:12.5px;font-family:inherit;
}
#lb .bar a:hover,#lb .bar button:hover{background:rgba(255,255,255,.22)}
/* 宽屏：显示右侧时间轴；中屏：只留左侧栏；窄屏：状态栏回到顶部横排 */
@media (min-width:1340px){
  .layout{grid-template-columns:276px minmax(0,1fr) 190px}
  .rail{display:flex}
}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    /* 窄屏下侧栏改成顶部横条，但**必须限高**：
       加了「高级筛选 / 导出」两个折叠小节之后，各项在窄屏上各占一整行，
       不限高的话 sticky 横条会长到 430px 以上，把手机屏幕挡住一大半
       （移动端专项测试实测 437px，就是这么发现的）。 */
    position:sticky;top:0;height:auto;max-height:190px;overflow-y:auto;overflow-x:hidden;
    z-index:60;
    flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;
    border-right:0;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--panel) 92%,transparent);
    backdrop-filter:saturate(180%) blur(14px);
    scrollbar-width:thin;
  }
  .side-top{flex:1 1 auto;min-width:0}
  .stats{flex:1 1 100%;order:9;line-height:1.6}
  .side-sec{flex:1 1 auto;min-width:210px}
  .side-sec .sec-t{display:none}
  .side-foot{margin-top:0;padding-top:0;grid-template-columns:auto auto}
  .side-foot .iconbtn{width:auto;padding:0 12px}
  .fab{display:flex;position:fixed;right:22px;bottom:22px;z-index:60;flex-direction:column;gap:8px}
  main{padding:16px 14px 90px}
}
@media (max-width:640px){
  .body{max-width:calc(100% - 50px)}
  .imgs img{max-width:170px;max-height:170px}
  /* 手机端把状态栏压到最薄：统计只留一行，筛选改为横向滚动一行，
     再把 sticky 横条限到 150px（超出的部分在里面滚动） */
  .sidebar{gap:8px;padding:9px 12px;max-height:150px}
  .stats{font-size:11.5px;line-height:1.5}
  .stats .s2,.stats .s3,.stats .s4{display:none}
  .side-sec{min-width:100%}
  .hitrow{min-height:0}
  .chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none;padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;height:30px;padding:0 12px}
  .side-foot{grid-template-columns:1fr 1fr;width:100%}
  .side-foot .iconbtn{width:100%}
}

/* ---------- 搜索结果：展开上下文 ---------- */
:root{ --hit:#e08a12; --ctxline:#c8cfda; }
html[data-theme="dark"]{ --hit:#ffb457; --ctxline:#333941; }

/* 命中消息下方的操作条 */
.ctxbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%;margin-top:2px;padding:0 4px}
.msg.me .ctxbar{justify-content:flex-end}
.ctxbar button{
  font:inherit;font-size:11.5px;line-height:1.5;padding:2px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
  white-space:nowrap;transition:border-color .15s,color .15s;
}
.ctxbar button:hover{border-color:var(--hit);color:var(--hit)}
.ctxbar button i,.ctxmore button i{font-style:normal;opacity:.72}
.ctxbar .ctxnum{font-size:11px;color:var(--muted);opacity:.85}

/* 上下文区块两端：「加载更多」/「到头了」 */
.ctxmore{display:flex;justify-content:center;margin:9px 0}
.ctxmore button{
  font:inherit;font-size:11.5px;line-height:1.5;padding:3px 14px;border-radius:999px;
  border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;
  transition:border-color .15s,color .15s;
}
.ctxmore button:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.ctxmore .ctxend{font-size:11px;color:var(--muted);opacity:.7;letter-spacing:.3px}

/* 上下文消息：整块淡化 + 一条竖线，和「搜索结果」区分开 */
.msg.ctx .body{opacity:.72;border-left:2px solid var(--ctxline);padding-left:9px}
.msg.ctx.me .body{border-left:0;border-right:2px solid var(--ctxline);padding-left:0;padding-right:9px}
.msg.ctx .av{opacity:.5}

/* 当前展开上下文的那条命中消息（高亮） */
.msg.hit{
  position:relative;border-radius:12px;padding:7px 9px;margin:9px -9px;
  background:color-mix(in srgb,var(--hit) 9%,transparent);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--hit) 50%,transparent);
}
.msg.hit .body{opacity:1}
.msg.hit .av{opacity:1}
.msg.hit .meta{color:var(--hit)}
.hitbadge{
  font-size:10px;font-weight:700;line-height:1.5;padding:0 6px;border-radius:999px;
  background:var(--hit);color:#fff;letter-spacing:.2px;
}
/* 落在别人上下文区域里的另一条搜索结果：细描边提示 */
.msg.hitsoft{
  border-radius:12px;padding:7px 9px;margin:9px -9px;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hit) 30%,transparent);
}

/* ==========================================================
   扩展功能（2026-09-16 新增）
   ----------------------------------------------------------
   · 高级筛选（发送者 / 类型 / 日期区间 / 正则 / 索引命中）
   · 导出（HTML / Markdown / TXT / JSON / JSONL，可打码、可加密）
   · 日历热力图 · 聊天节律 · 高频词云
   全部纯本地运算：不联网、无外部依赖、不上传任何数据。
   ========================================================== */

/* 热力图色阶 + 状态色（浅色主题） */
:root{
  --hm0:#e9edf3; --hm1:#c3d6f6; --hm2:#8db1ec; --hm3:#4f7cff; --hm4:#2b4ec4;
  --ok:#0f7a4d; --bad:#c62828;
}
html[data-theme="dark"]{
  --hm0:#1b1f26; --hm1:#24395c; --hm2:#2f5aa8; --hm3:#4f7cff; --hm4:#9dbcff;
  --ok:#4ade80; --bad:#ff8f8f;
}

/* ---------- 侧栏里的折叠小节 ---------- */
.fold{border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.fold>summary{
  cursor:pointer;list-style:none;padding:8px 11px;font-size:12.5px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:7px;outline:none;user-select:none;min-height:34px;
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";font-size:10px;color:var(--muted);transition:transform .15s;flex:0 0 auto}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary:hover{color:var(--accent)}
.fold .cnt{
  margin-left:auto;font-size:10.5px;font-weight:700;line-height:1.7;padding:0 7px;border-radius:999px;
  background:var(--chip-on);color:#fff;
}
.fold .cnt[hidden]{display:none}
.fold .fbody{padding:1px 11px 11px;display:flex;flex-direction:column;gap:8px}

/* ---------- 侧栏折叠小节里的表单控件（高级筛选 / 导出 共用） ---------- */
.fbody .frow{display:flex;align-items:center;gap:7px}
.fbody .frow>label{flex:0 0 42px;font-size:11.5px;color:var(--muted)}
.fbody select,.fbody input{
  flex:1 1 auto;min-width:0;height:29px;font:inherit;font-size:12.5px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0 7px;
}
.fbody input[type=date]{padding:0 4px}
.fbody .two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fbody .minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
  min-height:28px;padding:1px 10px;font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s;
}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini[aria-pressed="true"]{border-color:transparent;background:var(--chip-on);color:#fff;font-weight:600}
.rexerr{font-size:11px;color:var(--bad);line-height:1.5}
.rexerr[hidden]{display:none}

/* ---------- 导出 ---------- */
.expgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.expgrid button{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;
  min-height:34px;font:inherit;font-size:12px;cursor:pointer;padding:2px 8px;
  transition:border-color .15s,color .15s;
}
.expgrid button:hover{border-color:var(--accent);color:var(--accent)}
.expgrid button.primary{grid-column:1 / -1;background:var(--chip-on);color:#fff;border-color:transparent;font-weight:600}
.expgrid button.primary:hover{filter:brightness(1.07);color:#fff}
.exprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.exprow label{font-size:11.5px;color:var(--muted)}
.exprow input[type=password]{
  flex:1 1 90px;min-width:0;height:29px;font:inherit;font-size:12.5px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0 7px;
}
.expmsg{font-size:11.5px;color:var(--muted);line-height:1.6;word-break:break-word}
.expmsg.ok{color:var(--ok)}
.expmsg.bad{color:var(--bad)}
.expmsg[hidden]{display:none}

/* ---------- 统计面板里的新增小节 ---------- */
.stsec{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.stsec>h3{
  margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.stsec>h3 em{font-style:normal;font-size:11.5px;font-weight:400;color:var(--muted)}
.stsec .seg button{height:27px;font-size:12px;padding:0 10px}

/* 日历热力图 */
.hmwrap{overflow-x:auto;padding:2px 0 4px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.hminner{display:inline-block;padding:8px 10px 6px;min-width:100%}
.hmsvg{display:block}
.hmsvg rect.c{cursor:pointer;rx:2.5}
.hmsvg rect.c:hover{stroke:var(--text);stroke-width:1.6}
.hmleg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:5px}
.hmleg i{display:inline-block;width:11px;height:11px;border-radius:2.5px;vertical-align:-1px}
.hmleg .sp{flex:1 1 auto}

/* 聊天节律 */
.rhgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px}
.rhbox{border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:10px 12px;min-width:0}
.rhbox h4{margin:0 0 6px;font-size:12.5px;font-weight:600;color:var(--text)}
.rhbox .big{font-size:19px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;line-height:1.35}
.rhbox .big i{font-style:normal;font-size:11.5px;font-weight:400;color:var(--muted);margin-left:4px}
.rhbox .sub{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:4px}
.rhbox .sub b{color:var(--text)}
.rhbars{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:7px}
.rhbars span{flex:1 1 0;min-width:0;border-radius:2px 2px 0 0;background:var(--c-me);height:0}
.rhbars span.p{background:var(--c-peer)}
.rhaxis{display:flex;gap:2px;font-size:9px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.rhaxis span{flex:1 1 0;text-align:center;min-width:0;overflow:hidden}
.rhlg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:5px;align-items:center}
.rhlg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 高频词云 */
.wc{
  display:flex;flex-wrap:wrap;gap:3px 11px;align-items:baseline;justify-content:center;
  border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:13px 12px;min-height:96px;
}
.wc b{font-weight:700;line-height:1.3;white-space:nowrap;cursor:default}
.wc b small{font-weight:400;font-size:9.5px;opacity:.62;margin-left:2px}
.wcmeta{font-size:11.5px;color:var(--muted);line-height:1.65}

/* ---------- 扩展功能的响应式 ---------- */
@media (max-width:980px){
  .fold{min-width:210px}
  .fold[open]{flex:1 1 100%}
}
@media (max-width:760px){
  .rhgrid{grid-template-columns:1fr}
  .hminner{padding:7px 8px 5px}
}
@media (max-width:640px){
  .fold{min-width:100%}
  .fold .fbody{padding:1px 10px 10px}
  .expgrid{grid-template-columns:1fr 1fr}
  .mini{min-height:32px}
  .expgrid button{min-height:38px}
  .rhbars{height:46px}
  .wc{padding:11px 9px;gap:3px 9px;min-height:84px}
}

<body>

<div class="layout">

  <!-- 左侧常驻状态栏 -->
  <aside class="sidebar">

    <!-- 数据源切换：微博 / B站（同一套查看器，数据互不影响） -->
    <div class="srcsw" id="srcSw" role="tablist" aria-label="切换备份来源">
      <button type="button" role="tab" data-src="weibo" aria-pressed="true">微博</button>
      <button type="button" role="tab" data-src="bili" aria-pressed="false">B站</button>
    </div>

    <div class="side-top">
      <div class="brand"><i class="dot"></i><span id="title">微博私信备份</span></div>
      <button class="iconbtn" id="themeBtn" title="切换深浅主题">🌗</button>
    </div>

    <div class="stats" id="stats">载入中…</div>

    <div class="side-sec">
      <label class="search">
        <span class="ico">🔍</span>
        <input id="q" type="search" placeholder="搜索消息或图片里的文字…（按 / 聚焦）" autocomplete="off">
        <button class="clr" id="qclr" title="清空">✕</button>
      </label>
      <div class="hitrow">
        <span class="hitnav" id="hitnav">
          <button id="hitPrev" title="上一个匹配（Shift+Enter）">↑</button>
          <span class="pos" id="hitPos">0 / 0</span>
          <button id="hitNext" title="下一个匹配（Enter）">↓</button>
        </span>
        <span class="found" id="found"></span>
      </div>
      <div class="searchhint" id="ctxhint">每条命中消息下方都有「↕ 展开上下文」按钮，可看它前后的对话</div>
    </div>

    <div class="side-sec">
      <div class="sec-t">筛选</div>
      <div class="chips" id="chips">
        <button class="chip" data-f="all" aria-pressed="true">全部</button>
        <button class="chip" data-f="peer" aria-pressed="false">TA 发的</button>
        <button class="chip" data-f="me" aria-pressed="false">我发的</button>
        <button class="chip" data-f="img" aria-pressed="false">含图片</button>
        <button class="chip full" id="autoChip" aria-pressed="false"
                title="一键隐藏 / 显示对方的自动回复（按各会话的实际文案自动判定）">🚫 自动回复</button>
        <!-- 单独隐藏的消息：只在有隐藏项时出现；连点两次才全部恢复（防误触） -->
        <button class="chip full" id="hidChip" hidden
                title="这些是用右键「隐藏这条消息」藏起来的。点一下会问一次，4 秒内再点一次才全部恢复">🙈 已隐藏 0 条</button>

<!-- 会话清单（由 scripts/build_sessions.mjs 从项目根的 sessions.json 生成）。

<script src="sessions.js" onerror="window.__sessionsMissing=1"></script>
<script>
/* 额外会话（内置的微博 / B站 已经由下面的静态标签加载好了）：
   这里在解析期同步把这几个数据文件插进来，保证它们在主脚本之前就绪。
   ⚠ 注释和字符串里都不能出现完整的结束标签 —— 哪怕写在注释里，
     HTML 解析器也会当场把这个 script 块切断（本文件真踩过这个坑）。
     所以要拼着写：'<' + '/scr' + 'ipt>'。 */
(function(){
  var list = window.DM_SESSIONS;
  if(!list || !list.length) return;
  for(var i = 0; i < list.length; i++){
    var s = list[i];
    if(!s || s.builtin || !s.files) continue;
    ['messages','faces','ocr','vlm'].forEach(function(k){
      if(s.files[k]) document.write('<scr' + 'ipt src="' + s.files[k] + '"></scr' + 'ipt>');
    });
  }
})();
</script>

<script src="data/messages.js"></script>
<script src="data/faces.js"></script>
<script src="data/ocr.js" onerror="window.__ocrMissing=1"></script>
<script src="data/vlm.js" onerror="window.__vlmMissing=1"></script>
<!-- B站数据集（目录与全局名都与微博独立，缺失时不影响微博视图） -->
<script src="bili/messages.js" onerror="window.__biliMissing=1"></script>
<script src="bili/faces.js" onerror="window.__biliFacesMissing=1"></script>
<script src="bili/ocr.js" onerror="window.__biliOcrMissing=1"></script>
<script src="bili/vlm.js" onerror="window.__biliVlmMissing=1"></script>
<script>
/* ==========================================================
   数据源注册表：微博 / B站 共用同一个查看器，顶部按钮切换
   ----------------------------------------------------------
   两套数据完全独立，各自有自己的目录与导出的全局名：
     微博  data/messages.js → window.DM_DATA     （+ DM_FACES / DM_OCR / DM_VLM）
     B站   bili/messages.js → window.DM_DATA_B   （+ DM_FACES_B / DM_OCR_B / DM_VLM_B）
   ========================================================== */
/* 数据源注册表由「会话清单」驱动（多会话支持）
   ----------------------------------------------------------
   清单来源优先级：
     1) <script src="sessions.js"> 里的 window.DM_SESSIONS
        —— 由 scripts/build_sessions.mjs 从项目根的 sessions.json 生成
     2) 清单缺失时用下面的内置兜底（微博 / B站），保证页面不会打不开

   每个会话声明它自己的：
     · dir      数据目录（data / bili / 其它）
     · globals  承载数据的全局变量名（DM_DATA / DM_DATA_B / ...）
     · builtin  true = 这个数据文件在 HTML 里已有静态 <script> 标签
                false = 由页头那段注入脚本在解析期动态插入
   ========================================================== */
var BUILTIN_SESSIONS = [
  {
    key:'weibo', label:'微博', title:'微博私信备份', dir:'data', builtin:true,
    globals:{ data:'DM_DATA', faces:'DM_FACES', ocr:'DM_OCR', vlm:'DM_VLM' },
    autoReply:'',
    empty:'未找到数据文件 <code>data/messages.js</code><br>请先运行一次「命令/备份与更新/更新备份.cmd」',
  },
  {
    key:'bili', label:'B站', title:'B站私信备份', dir:'bili', builtin:true,
    globals:{ data:'DM_DATA_B', faces:'DM_FACES_B', ocr:'DM_OCR_B', vlm:'DM_VLM_B' },
    autoReply:'',
    empty:'未找到数据文件 <code>bili/messages.js</code><br>请先运行一次「命令/备份与更新/更新B站备份.cmd」' +
          '（首次需要在弹出的浏览器窗口里扫码登录 B站）',
  },
];

var SESSION_LIST = (window.DM_SESSIONS && window.DM_SESSIONS.length)
  ? window.DM_SESSIONS : BUILTIN_SESSIONS;

var SOURCES = {};
SESSION_LIST.forEach(function(s){
  if(!s || !s.key) return;
  var g = s.globals || {};
  SOURCES[s.key] = {
    key: s.key,
    label: s.label || s.key,
    title: s.title || ((s.label || s.key) + '私信备份'),
    dir: s.dir || '',
    builtin: !!s.builtin,
    data: g.data ? window[g.data] : undefined,
    faces: g.faces ? window[g.faces] : undefined,
    ocr: g.ocr ? window[g.ocr] : undefined,
    vlm: g.vlm ? window[g.vlm] : undefined,
    autoReply: s.autoReply || '',
    empty: s.empty || ('未找到数据文件 <code>' + (s.dir || '') +
                       '/messages.js</code><br>请先运行一次对应的更新脚本'),
  };
});

/* 顶部切换条的渲染顺序 */
var SESSION_ORDER = Object.keys(SOURCES);

/* 切换数据源时，把整棵 DOM 恢复成「初始快照」——
   这样所有节点都是全新的，监听器不会因为反复 boot 而重复叠加。 */
var SNAP = null;
function snapDom(){
  if(!SNAP) SNAP = {
    layout: document.querySelector('.layout').cloneNode(true),
    fab:    document.querySelector('.fab').cloneNode(true),
    lb:     document.getElementById('lb').cloneNode(true),
    stat:   document.getElementById('stat').cloneNode(true),
  };
  return SNAP;
}
function resetDom(){
  var S = snapDom();
  [[ '.layout', S.layout ], [ '.fab', S.fab ], [ '#lb', S.lb ], [ '#stat', S.stat ]]
    .forEach(function(p){
      var cur = document.querySelector(p[0]);
      if(cur && cur.parentNode) cur.parentNode.replaceChild(p[1].cloneNode(true), cur);
    });
}

var CUR_SRC = null;

function boot(srcKey){
  var SRC = SOURCES[srcKey] || SOURCES.weibo;
  CUR_SRC = SRC.key;

  // 摘掉上一轮的全局监听，再重建 DOM（节点级监听器随旧节点一起扔掉）
  if(boot._bound){
    boot._bound.forEach(function(b){
      (b[2] ? window : document).removeEventListener(b[0], b[1], b[3]);
    });
  }
  var BOUND = boot._bound = [];
  /* opt 会一起记下来：带 {passive:true} 注册的监听器要用同样的参数摘，
     否则将来某天改成 capture:true 就会摘不干净（触屏长按就是这么注册的）。 */
  function onDoc(ev, fn, opt){ document.addEventListener(ev, fn, opt); BOUND.push([ev, fn, 0, opt]); }
  function onWin(ev, fn, opt){ window.addEventListener(ev, fn, opt); BOUND.push([ev, fn, 1, opt]); }

  resetDom();
  bindSrcSwitch();

  var D = SRC.data;
  if(!D){
    document.getElementById('title').textContent = SRC.title;
    document.title = SRC.title;
    document.getElementById('stats').innerHTML = '<span class="s1">尚无数据</span>';
    document.getElementById('chat').innerHTML = '<div class="empty">' + SRC.empty + '</div>';
    return;
  }

  var META = D.meta || {}, ALL = D.messages || [];
  /* 双方显示名一律从数据里取 —— 页面里不写死任何昵称。
     换人 / 换账号只需改 sessions.json 后重抓，查看页不用动。 */
  var PEER_LABEL = META.peer_name || '对方';
  var SELF_LABEL = META.self_name || '我';
  var CHUNK = 150;
  var AUTO_REPLY = SRC.autoReply || '';   // B站没有固定文案，靠 msg_source 结构化判定

  // 索引：图片总数 + 每条消息在【完整会话】里的下标（展开上下文要用）
  var allImages = [];
  ALL.forEach(function(m, i){
    m._ai = i;
    (m.images||[]).forEach(function(im, j){ if(im.local){ im._mi = i; im._ij = j; allImages.push(im); } });
  });

  /* ---------- 图片文字索引（OCR）----------
     数据来自 data/ocr.js；这个文件是可选的，
     卸掉 OCR 环境后其它功能不受任何影响。 */
  var OCR = (SRC.ocr || {});
  var OCR_KEYS = Object.keys(OCR).filter(function(k){ return k !== '_meta'; });
  var ocrWithText = OCR_KEYS.filter(function(k){ return (OCR[k]||{}).t; }).length;
  ALL.forEach(function(m){
    var parts = [];
    (m.images||[]).forEach(function(im){
      if(!im.local) return;
      var o = OCR[im.local.split('/').pop()];
      if(o && o.t){
        var s = String(o.t).replace(/\s+/g, ' ').trim();
        if(s){ im._ocrt = s; parts.push(s); }
      }
    });
    if(parts.length) m._ocr = parts.join(' ');
  });

  /* ---------- 图片内容描述索引（VLM）----------
     数据来自 data/vlm.js；只对「OCR 没识别到文字的图片」生成（截图不上云），
     同样可选：文件缺失时其它功能一切照常。 */
  var VLM = (SRC.vlm || {});
  var VLM_KEYS = Object.keys(VLM).filter(function(k){ return k !== '_meta'; });
  var vlmWithDesc = VLM_KEYS.filter(function(k){ return (VLM[k]||{}).d; }).length;
  ALL.forEach(function(m){
    var vs = [];
    (m.images||[]).forEach(function(im){
      if(!im.local) return;
      var v = VLM[im.local.split('/').pop()];
      if(v && v.d){
        var s = String(v.d).replace(/\s+/g, ' ').trim();
        if(s){ im._vlmt = s; vs.push(s); }
      }
    });
    if(vs.length) m._vlm = vs.join(' ');
  });

  document.getElementById('title').textContent = SRC.title + ' · ' + (META.peer_name || '');
  document.title = SRC.title + ' · ' + (META.peer_name || '');
  var legPeer = document.getElementById('legPeer');
  if(legPeer) legPeer.textContent = PEER_LABEL + '回复';
  var fmt = function(t){ return t ? new Date(t).toLocaleString('zh-CN',{hour12:false}) : '?'; };
  var fmtD = function(t){ return t ? new Date(t).toLocaleDateString('zh-CN') : '?'; };
  document.getElementById('stats').innerHTML =
    '<span class="s1"><b>' + (META.total||0).toLocaleString() + '</b> 条消息 · <b>' +
      (META.images||0).toLocaleString() + '</b> 张图片</span>' +
    '<span class="s2">' + fmtD(META.first_time) + ' ~ ' + fmtD(META.last_time) + '</span>' +
    '<span class="s3">更新于 ' + fmt(META.updated_at) + '</span>' +
    ((ocrWithText || vlmWithDesc)
       ? '<span class="s4">图片可搜索 <b>' + (ocrWithText + vlmWithDesc).toLocaleString() +
         '</b> 张（文字 ' + ocrWithText.toLocaleString() + ' · 描述 ' +
         vlmWithDesc.toLocaleString() + '）</span>' : '');

  /* ---------- 状态 ---------- */
  var st = {
    q:'', filter:'all', list:ALL.slice(), win:0, hideAuto:false, hitIdx:-1, autoHidden:0, ctx:{},
    hid:{},                   // 单独隐藏的消息 id（右键菜单「隐藏这条消息」）
    /* 高级筛选（P1-5）：与上面的快捷筛选、搜索词**叠加**生效 */
    type:'all', since:'', until:'', regex:false, onlyOcr:false, onlyVlm:false
  };
  try{ st.hideAuto = localStorage.getItem('dm-hide-auto-' + SRC.key) === '1'; }catch(e){}

  /* ==========================================================
     「单独隐藏某条消息」（右键菜单）
     ----------------------------------------------------------
     与上面的「一键隐藏自动回复」是**两套互相独立**的开关：
       · hideAuto —— 全局开关，按类型自动判定，随时可整体关掉
       · st.hid   —— 手工挑出来的具体消息，逐条记录

     存的是消息 id，不是数组下标：数据只会往后追加，id 唯一且稳定，
     所以下次「更新备份 / 重建备份」之后隐藏记录依然对得上。
     按数据源分开存（dm-hidden-weibo / dm-hidden-bili），互不串。

     隐藏后的行为（三处一致）：
       ① 浏览列表里不出现
       ② 搜索结果里不出现（搜到它也不会冒出来）
       ③ 只有「展开上下文」时留一条虚线占位条，正文/图片一律不渲染
     恢复方式：
       · 点上下文里的占位条（或它的「恢复」按钮）
       · 右键占位条 →「恢复这条消息」
       · 侧栏「🙈 已隐藏 N 条」连点两次 → 全部恢复
     ========================================================== */
  var HID_KEY = 'dm-hidden-' + SRC.key;
  function mId(m){ return (m && m.id != null) ? String(m.id) : ''; }
  function isHid(m){ var k = mId(m); return !!(k && st.hid[k]); }
  function hidCount(){ return Object.keys(st.hid).length; }
  try{
    var _hidRaw = localStorage.getItem(HID_KEY);
    if(_hidRaw) JSON.parse(_hidRaw).forEach(function(k){ st.hid[String(k)] = 1; });
  }catch(e){}
  function saveHidden(){
    try{ localStorage.setItem(HID_KEY, JSON.stringify(Object.keys(st.hid))); }catch(e){}
  }

  /* 轻提示：单例挂在 body 上（不放进 .layout，免得每次切数据源重复创建） */
  function toast(msg){
    var el = document.getElementById('toastEl');
    if(!el){
      el = document.createElement('div');
      el.id = 'toastEl'; el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove('on'); }, 2000);
  }

  var hidArmed = 0, hidTimer = null;
  function refreshHidden(){
    var n = hidCount(), c = document.getElementById('hidChip');
    if(hidArmed && !n) hidArmed = 0;
    if(c){
      c.hidden = (n === 0);
      c.setAttribute('aria-pressed', hidArmed ? 'true' : 'false');
      c.textContent = hidArmed
        ? '⚠ 再点一次：全部恢复'
        : ('🙈 已隐藏 ' + n.toLocaleString() + ' 条');
    }
    updateCtxHint();
  }
  /* 搜索提示行：把「上下文里为什么少了自动回复 / 为什么有占位条」说清楚，
     免得看起来像是漏消息。 */
  function updateCtxHint(){
    var h = document.getElementById('ctxhint');
    if(!h) return;
    h.innerHTML = '每条命中消息下方都有「↕ 展开上下文」按钮，可看它前后的对话' +
      (st.hideAuto ? '<br>（自动回复已按当前设置跳过，不会出现在上下文里）' : '') +
      (hidCount() ? '<br>（已隐藏的消息在上下文里只显示占位条，点一下就能恢复）' : '');
  }

  function setHidden(m, on){
    var k = mId(m);
    if(!k) return false;
    if(on) st.hid[k] = 1; else delete st.hid[k];
    saveHidden();
    return true;
  }
  function restoreOne(id){
    if(!st.hid[id]) return;
    delete st.hid[id];
    saveHidden();
    applyFilter(); render();
    toast('已恢复这条消息');
  }
  /* 全部恢复要连点两次：第一次只是「上膛」，4 秒内不点第二次就自动解除 */
  function armRestoreAll(){
    if(hidArmed){ restoreAllHidden(); return; }
    if(!hidCount()) return;
    hidArmed = 1;
    refreshHidden();
    clearTimeout(hidTimer);
    hidTimer = setTimeout(function(){ hidArmed = 0; refreshHidden(); }, 4000);
  }
  function restoreAllHidden(){
    var n = hidCount();
    if(!n) return;
    st.hid = {}; saveHidden();
    hidArmed = 0; clearTimeout(hidTimer);
    applyFilter(); render();
    toast('已恢复全部 ' + n.toLocaleString() + ' 条隐藏消息');
  }

  function around(s, p, qlen){
    var a = Math.max(0, p - 14), b = Math.min(s.length, p + qlen + 14);
    return (a > 0 ? '…' : '') + s.slice(a, b) + (b < s.length ? '…' : '');
  }

  function haystack(m){
    var s = (m.text||'') + ' ' + (m.sender||'') + ' ' + (m.type||'') + ' ' +
            (m._ocr||'') + ' ' + (m._vlm||'');
    // 卡片要把标题/子类型/BV号一起纳入搜索：B站分享的视频、专栏正文为空，
    // 标题只存在 card.title 里，漏掉就等于这些内容完全搜不到。
    if(m.card) s += ' ' + (m.card.author||'') + ' ' + (m.card.kind||'') + ' ' +
                    (m.card.title||'') + ' ' + (m.card.sub||'') + ' ' +
                    (m.card.text||'') + ' ' + (m.card.url||'') + ' ' +
                    (m.card.bvid||'') + ' ' + (m.card.extra||'');
    (m.links||[]).forEach(function(l){ s += ' ' + (l.short||'') + ' ' + (l.long||'') + ' ' + (l.title||''); });
    return s.toLowerCase();
  }

  /* ---------- 高级筛选的生效条件（供计数徽标与提示用） ---------- */
  function advActiveCount(){
    var n = 0;
    if(st.type !== 'all') n++;
    if(st.since) n++;
    if(st.until) n++;
    if(st.regex) n++;
    if(st.onlyOcr) n++;
    if(st.onlyVlm) n++;
    return n;
  }
  function updateAdvCnt(){
    var el = document.getElementById('advCnt');
    if(!el) return;
    var n = advActiveCount();
    if(n){ el.hidden = false; el.textContent = n; } else { el.hidden = true; }
  }

  function applyFilter(){
    var q = st.q.trim(), rx = null;

    /* 正则模式：写错了不能让页面炸掉 —— 退回普通「包含」匹配并明确提示 */
    if(q && st.regex){
      try{ rx = new RegExp(q, 'i'); }catch(e){ rx = null; }
    }
    var rexEl = document.getElementById('advRexErr');
    if(rexEl){
      if(q && st.regex && !rx){
        rexEl.hidden = false;
        rexEl.textContent = '⚠ 正则表达式写错了，本次已退回「普通包含」匹配';
      } else {
        rexEl.hidden = true;
      }
    }

    /* 日期区间：与「日」的归属**共用同一套边界** —— 起点 = 当天 05:00，
       上界 = 次日 05:00（不含）。两者若不同源，「筛 9/15」就会混进 9/16 凌晨的消息。 */
    var sinceTs = st.since ? dayStartTs(st.since) : 0;
    var untilTs = st.until ? dayEndTs(st.until) : 0;

    var autoHidden = 0;
    st.ctx = {};              // 换了搜索词/筛选条件，之前展开的上下文作废
    st.list = ALL.filter(function(m){
      /* 单独隐藏的消息是**硬性排除**：不管搜什么、筛什么都不出现。
         它只可能在「展开上下文」里以占位条的形式露个面（见 buildItems）。 */
      if(isHid(m)) return false;
      if(st.filter==='peer' && m.from!=='peer') return false;
      if(st.filter==='me' && m.from!=='me') return false;
      if(st.filter==='img' && !(m.images||[]).some(function(i){return i.local||i.url;})) return false;
      if(st.type !== 'all' && (m.type || 'other') !== st.type) return false;
      if(sinceTs && !(m.ts >= sinceTs)) return false;
      if(untilTs && !(m.ts < untilTs)) return false;
      if(st.onlyOcr && !m._ocr) return false;       // 只看「图片里有字」的
      if(st.onlyVlm && !m._vlm) return false;       // 只看「图片有内容描述」的
      if(rx){
        if(!rx.test(haystack(m))) return false;
      } else if(q && haystack(m).indexOf(q.toLowerCase()) < 0) return false;
      if(st.hideAuto && msgKind(m) === 'auto'){ autoHidden++; return false; }
      return true;
    });
    st.autoHidden = autoHidden;
    var parts = [];
    var advN = advActiveCount();
    if(st.q) parts.push((rx ? '正则命中 ' : '命中 ') + st.list.length.toLocaleString() + ' 条');
    else if(st.filter !== 'all' || advN) parts.push('筛出 ' + st.list.length.toLocaleString() + ' 条');
    if(st.hideAuto) parts.push('已隐藏自动回复 ' + autoHidden.toLocaleString() + ' 条');
    document.getElementById('found').textContent = parts.join('　·　');
    var hint = document.getElementById('ctxhint');
    if(hint) hint.style.display = (st.q && st.list.length) ? 'block' : 'none';
    updateAdvCnt();
    updateHitNav();
    refreshHidden();
    buildRail();
    return st.list;
  }

  function updateHitNav(){
    var nav = document.getElementById('hitnav');
    if(!st.q || !st.list.length){ nav.classList.remove('on'); return; }
    nav.classList.add('on');
    document.getElementById('hitPos').textContent =
      (st.hitIdx >= 0 ? (st.hitIdx + 1).toLocaleString() : '–') + ' / ' + st.list.length.toLocaleString();
    document.getElementById('hitPrev').disabled = st.hitIdx <= 0;
    document.getElementById('hitNext').disabled = st.hitIdx < 0 || st.hitIdx >= st.list.length - 1;
  }

  function updateAutoChip(){
    var c = document.getElementById('autoChip');
    if(!c) return;
    c.setAttribute('aria-pressed', st.hideAuto ? 'true' : 'false');
    c.textContent = st.hideAuto ? '🙈 自动回复已隐藏' : '🚫 自动回复';
    c.title = (SRC.key === 'bili')
      ? '一键隐藏 / 显示 B站的自动回复：接口 msg_source 为 8~11、17，以及关注后的自动推送（msg_type 16）'
      : '一键隐藏 / 显示' + esc(PEER_LABEL) + '的自动回复「' + AUTO_REPLY + '」';
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function hl(s){
    var q = st.q.trim();
    if(!q) return esc(s);
    var out = '', low = s.toLowerCase(), ql = q.toLowerCase(), i = 0, k;
    while((k = low.indexOf(ql, i)) >= 0){
      out += esc(s.slice(i,k)) + '<mark>' + esc(s.slice(k,k+q.length)) + '</mark>';
      i = k + q.length;
    }
    return out + esc(s.slice(i));
  }

  /* ---------- 官方表情图（把 [委屈] / [/ee808d.png] 还原成图片）---------- */
  var FACES = (SRC.faces || { phrase:{}, ee:{} });
  var RE_EE_TOKEN = /^\/?(ee[0-9a-f]{4,6})\.(?:png|gif)$/i;
  var RE_FACE = /\[([^\[\]\s]{1,20})\]|\/?(ee[0-9a-f]{4,6})\.(?:png|gif)/gi;

  function faceImg(token){
    if(!token) return null;
    var m = RE_EE_TOKEN.exec(token), rel = null;
    if(m) rel = FACES.ee && FACES.ee[m[1].toLowerCase()];
    // 两套数据的 phrase 键格式不同：微博是 "[微笑]"，B站是 "tv_doge"（无括号）。
    // richText 传进来的是去掉括号的 token，所以两种都试一次。
    else if(FACES.phrase) rel = FACES.phrase[token] || FACES.phrase['[' + token + ']'];
    if(!rel) return null;
    return '<img class="face" src="' + esc(rel) + '" alt="' +
           esc(token.replace(/[\[\]]/g,'')) + '" title="' + esc(token.replace(/[\[\]]/g,'')) + '">';
  }

  // 把已转义文本里的网址变成可点击链接（正文内链接，不重复占位）
  function linkify(h){
    return h.replace(/(https?:\/\/[^\s<，。！？、“”‘’）)】]+)/g, function(u){
      return '<a class="txtlink" href="' + u + '" target="_blank" rel="noreferrer">' + u + '</a>';
    });
  }

  // 正文渲染：表情还原成官方图 + 关键词高亮 + 网址可点
  function richText(s){
    if(s == null || s === '') return '';
    var out = '', i = 0, m;
    RE_FACE.lastIndex = 0;
    while((m = RE_FACE.exec(s))){
      out += linkify(hl(s.slice(i, m.index)));
      var img = faceImg(m[2] ? m[2] : m[1]);
      out += img || linkify(hl(m[0]));
      i = RE_FACE.lastIndex;
    }
    return out + linkify(hl(s.slice(i)));
  }

  /* ---------- 微博链接归一化：mid 与短链指向同一条时只保留一个 ---------- */
  var B62 = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function mid2b62(mid){
    var out = '';
    for(var i = mid.length - 7; i > -7; i -= 7){
      var seg = mid.substring(Math.max(i, 0), i + 7);
      var num = parseInt(seg, 10), s = '';
      for(var k = 0; k < 4; k++){ s = B62.charAt(num % 62) + s; num = Math.floor(num / 62); }
      out = s + out;
    }
    return out.replace(/^0+/, '') || '0';
  }
  function weiboKey(url){
    if(!url) return '';
    var m = /(?:weibo\.com|weibo\.cn)\/(?:u\/)?(\d+)\/([0-9A-Za-z]+)/.exec(String(url));
    if(!m) return '';
    return m[1] + ':' + (/^\d+$/.test(m[2]) ? mid2b62(m[2]) : m[2]);
  }
  // B站链接归一化：同一支视频 / 专栏 / 动态的 BV 号、av 号、短链只保留一条
  function biliKey(url){
    if(!url) return '';
    var s = String(url), m;
    if((m = /(BV[0-9A-Za-z]{10})/.exec(s))) return 'bv:' + m[1];
    if((m = /read\/cv(\d+)/i.exec(s))) return 'cv:' + m[1];
    if((m = /t\.bilibili\.com\/(\d+)/.exec(s))) return 'dyn:' + m[1];
    if((m = /\/(?:video\/)?av(\d+)/i.exec(s))) return 'av:' + m[1];
    if((m = /bangumi\/play\/(?:ss|ep)(\d+)/i.exec(s))) return 'pgc:' + m[1];
    return '';
  }
  // 按当前数据源选归一化规则（微博那套逻辑保持原样，不受影响）
  function linkKey(u){
    if(SRC.key === 'bili') return biliKey(u) || String(u || '');
    return weiboKey(u) || String(u || '');
  }
  function fmtShort(created){
    if(!created) return '';
    var d = new Date(created);
    if(isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  /* ================= 一天的边界：不是 00:00，是每天凌晨 05:00 =================
     「某天」= 当天 05:00 → 次日 05:00。所以 00:00~05:00 的消息算作**前一天**。
     为什么非改不可：实测本站数据里 33.75%（微博 2,675/7,925）、
     51.68%（B站 1,505/2,912）的消息落在 00:00~05:00 —— 按自然日切会把一场
     深夜聊天从中间劈成两天，「有来有回」「日均」这些按天统计跟着失真。

     实现只有一条铁律：**先把时间戳减 5 小时，再取年月日**。
     本文件其余地方一律走这里的函数，别再自己 new Date(ts).getDate()。 */
  var DAY_CUT = 5 * 60 * 60 * 1000;      // 换日时刻：凌晨 5 点
  var DAY_CUT_H = 5;                     // 换日时刻（小时），给 setHours 用
  var DAY_CUT_S = '05:00';               // 同一时刻的**展示写法**：文案一律用它。
                                         // 别写 DAY_CUT_H + ':00' —— 会渲染成「5:00」，
                                         // 和别处的「05:00」对不上（被 verify_daycut 抓到过）。
  function dayDate(t){ return new Date((t instanceof Date ? t.getTime() : t) - DAY_CUT); }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  // 逻辑日 / 逻辑月：同一个偏移出来的，避免「日归属 A、月归属 B」这种自相矛盾
  function dayKey(t){ return ymd(dayDate(t)); }
  function monthKey(t){ return ym(dayDate(t)); }
  // 逻辑日 key → 该日正午：取星期、加天数都最稳（绕开夏令时在午夜附近的偏移）
  // 非法 key 返回 null，让上层退化成「不加这个条件」，而不是把 NaN 混进比较里
  function dayNoon(k){
    var p = String(k == null ? '' : k).split('-');
    if(p.length !== 3 || !/^\d{4}$/.test(p[0])) return null;
    var d = new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0, 0);
    return isNaN(d.getTime()) ? null : d;
  }
  // 逻辑日 key → 该日真正的起点（当天 05:00）与上界（次日 05:00，不含）
  function dayStartTs(k){ var d = dayNoon(k); if(!d) return 0; d.setHours(DAY_CUT_H, 0, 0, 0); return d.getTime(); }
  function dayEndTs(k){ var d = dayNoon(k); if(!d) return 0; d.setDate(d.getDate()+1); d.setHours(DAY_CUT_H, 0, 0, 0); return d.getTime(); }
  function dayLabel(t){
    var d = dayDate(t), w = ['日','一','二','三','四','五','六'][d.getDay()];
    return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w;
  }
  /* 分隔条 tooltip：把「这天到底指哪 24 小时」写明白，
     否则看到 03:00 的消息挂在昨天下面会以为是 bug */
  function dayTip(k){
    var f = function(ms){ var d = new Date(ms);
      return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
    return '按每天 ' + DAY_CUT_S + ' 分界：' + f(dayStartTs(k)) + ' ' + DAY_CUT_S + ' → ' +
           f(dayEndTs(k)) + ' ' + DAY_CUT_S + '（00:00~' + DAY_CUT_S + ' 算前一天）';
  }
  /* 这条提示同时出现在侧栏、分隔条 tooltip 和统计口径里，措辞保持一致 */
  var DAY_CUT_NOTE = '日期按每天凌晨 ' + DAY_CUT_S + ' 分界（00:00~' + DAY_CUT_S + ' 的消息算前一天）';
  function hhmm(t){
    var d = new Date(t);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function avatar(m){
    var src = m.from === 'me' ? META.self_avatar_local : META.peer_avatar_local;
    if(!src) src = m.from === 'me' ? META.self_avatar : META.peer_avatar;
    var name = m.from === 'me' ? (META.self_name||'我') : (META.peer_name||'TA');
    if(src) return '<img class="av" src="'+esc(src)+'" data-fb="'+esc(name.slice(0,1))+'" alt="">';
    return '<div class="av-fb">'+esc(name.slice(0,1))+'</div>';
  }
  function fixAvatars(){
    Array.prototype.forEach.call(chat.querySelectorAll('img.av'), function(el){
      el.onerror = function(){

  /* 图片没能落到本地（下载时接口就已 404，例如 B站相簿封面被删）

  var TYPE_LABEL = {text:'文字', image:'图片', emoji:'表情', video:'视频', voice:'语音', link:'链接', card:'卡片', other:'消息', recalled:'已撤回', recall:'撤回提示', notice:'系统提示', ai:'AI 消息'};

  function renderBubble(m, idx, opt){
    opt = opt || {};
    var isMe = m.from === 'me';
    // 搜索结果里：st.ctx[m._ai] 存在 = 这条正在展开上下文 → 强高亮
    //                opt.inctx   = 这条落在别人的上下文区域里 → 细描边
    var isHitMode = !!(st.q && st.list.length);
    var isExpand  = !!(isHitMode && st.ctx[m._ai] !== undefined);
    var isCtxHit  = !!(isHitMode && !isExpand && opt.hit && opt.inctx);
    var inner = '';
    var txt = m.text || '';
    /* 两个概念在这里汇合：
       · isHidMsg  —— 被「单独隐藏」→ 整条只渲染成占位条（点一下恢复）
       · autoMuted —— 被「隐藏自动回复」挡掉 → 正文不渲染
       autoMuted 只会出现在展开的上下文里：列表/搜索里它们已经被 applyFilter 排除了。 */
    var isHidMsg = isHid(m);
    var autoMuted = (msgKind(m) === 'auto') && st.hideAuto;
    var card = m.card || null;
    var isWeiboCard = !!(card && card.kind === 'weibo');   // 分享的微博
    var isBiliCard  = !!(card && card.kind === 'bili');    // B站分享 / 推送 / 通知卡片
    var isWboxCard  = !!(card && card.kind === 'wbox');    // 「查看动图」→ 图片已单独展示
    var imgs = (m.images||[]);
    // 动图表情消息：正文是个没意义的 t.cn 短链，不要为它生成链接区
    var hasEmoji = (m.media_type === 9 || m.media_type === 15) && imgs.length > 0;

    if(m.recalled) inner += '<div class="recalled">[消息已撤回]（原内容仍保留在下方）</div>';

    // 图片（含视频封面：kind==='cover'，下面会额外标注）
    if(imgs.length){
      var g = '<div class="imgs">';
      imgs.forEach(function(im){
        var src = im.local || im.url || '';
        if(!src) return;
        var idx = allImages.indexOf(im);
        var cls = im.kind === 'emoji' ? 'emoji' : '';
        // 命中「图内文字」或「图片内容描述」时：给图片描边，并把命中片段显示出来
        var tip = '', tipLabel = '';
        var q = st.q.trim();
        if(q){
          var lq = q.toLowerCase();
          var po = im._ocrt ? im._ocrt.toLowerCase().indexOf(lq) : -1;
          if(po >= 0){
            cls += ' ocrhit'; tipLabel = '图内文字';
            tip = around(im._ocrt, po, q.length);
          }else{
            var pv = im._vlmt ? im._vlmt.toLowerCase().indexOf(lq) : -1;
            if(pv >= 0){
              cls += ' vlmhit'; tipLabel = '图片内容';
              tip = around(im._vlmt, pv, q.length);
            }
          }
        }
        var tag = '<img loading="lazy" class="'+cls+'" src="'+esc(src)+'" data-ii="'+idx+'" alt=""' +
             (im.kind === 'cover' ? ' title="视频/语音封面"' : '') + '>';
        g += tip
          ? '<span class="imgwrap">' + tag + '<span class="ocrtip">' + tipLabel + '：' + hl(tip) + '</span></span>'
          : tag;
      });
      g += '</div>';
      inner += g;
    }

    /* ---- 链接汇总：同一条微博的 mid / 短链 / 正文 URL 只保留一条 ---- */
    var seen = {}, uniq = [];
    function addLink(u){
      if(!u) return;
      var k = linkKey(u);
      if(seen[k]) return;
      seen[k] = 1; uniq.push(u);
    }
    var tt0 = txt.trim();
    var onlyUrl = /^https?:\/\/\S+$/.test(tt0);
    var txtUrls = txt.match(/https?:\/\/[^\s，。！？、“”‘’）)】]+/g) || [];
    // 正文里已经原样显示的网址 → 从链接区剔掉，避免同一个链接出现两次
    var inText = {};
    if(!onlyUrl) txtUrls.forEach(function(u){ inText[linkKey(u)] = 1; });

    if(card && card.url && !isWboxCard) addLink(card.url);
    (m.links || []).forEach(function(l){
      var k1 = l.long ? linkKey(l.long) : '';
      var k2 = l.short ? linkKey(l.short) : '';
      if((k1 && inText[k1]) || (k2 && inText[k2])) return;   // 正文里已有，不再列
      addLink(l.long || l.short);
    });
    if(m.gif_video) addLink(m.gif_video);
    if(onlyUrl) txtUrls.forEach(addLink);

    if(isWeiboCard){
      /* ---- 分享的微博：默认折叠成「作者 + 两行摘要 + 小图」，点展开看全部 ---- */
      var needBtn = (card.text || '').length > 46 || imgs.length > 0;
      inner += '<div class="wcard">' +
        '<div class="wcard-h">📄 ' + hl(card.author || '微博') +
          (card.created ? ' <span class="wt">' + esc(fmtShort(card.created)) + '</span>' : '') +
        '</div>' +
        (card.text ? '<div class="wcard-t">' + richText(card.text) + '</div>' : '') +
        (uniq.length ? '<a class="wcard-link" href="' + esc(uniq[0]) + '" target="_blank" rel="noreferrer">🔗 打开原微博</a>' : '') +
        (needBtn ? '<button class="wcard-btn" type="button">展开详情</button>' : '') +
        '</div>';
      // 正文与 links 已并入卡片，不再重复渲染（需求4）
    } else if(isBiliCard){
      /* ---- B站卡片：分享视频/专栏/动态/直播、视频推送、UP主赠言、官方通知 ---- */
      var needBtnB = ((card.title || '').length + (card.text || '').length) > 46 || imgs.length > 0;
      // 分享视频这类卡片的 title 与 text 是同一串文字（实测 130 条里 90 条完全相同），
      // 直接渲染会上下重复显示两遍；只有确实不同时才额外渲染正文。
      var cardText = (card.text && card.text.trim() !== (card.title || '').trim()) ? card.text : '';
      inner += '<div class="wcard bc">' +
        '<div class="wcard-h">📺 ' + hl(card.sub || 'B站') +
          (card.author ? ' <span class="wa">· ' + hl(card.author) + '</span>' : '') +
          (card.created ? ' <span class="wt">' + esc(fmtShort(card.created)) + '</span>' : '') +
          (card.extra ? ' <span class="wt">· ' + esc(card.extra) + '</span>' : '') +
        '</div>' +
        (card.title ? '<div class="wcard-t wtitle">' + richText(card.title) + '</div>' : '') +
        (cardText ? '<div class="wcard-t">' + richText(cardText) + '</div>' : '') +
        (uniq.length ? '<a class="wcard-link" href="' + esc(uniq[0]) + '" target="_blank" rel="noreferrer">🔗 打开原链接</a>' : '') +
        (needBtnB ? '<button class="wcard-btn" type="button">展开详情</button>' : '') +
        '</div>';
    } else {
      // 正文
      var tt = tt0;
      var hideTxt = onlyUrl ||
                    (tt === '分享图片') || (tt === '分享视频') || (tt === '分享语音') ||
                    (tt === '[动画表情]' && imgs.length) ||
                    autoMuted;
      if(txt && !hideTxt){
        inner += (inner ? '<div style="margin-top:6px">' : '') + richText(txt) + (inner ? '</div>' : '');
      }
      // 链接（去重后）；动图表情消息不显示链接区
      if(uniq.length && !hasEmoji){
        var ls = '<div class="links">';
        uniq.forEach(function(u){
          ls += '<a href="' + esc(u) + '" target="_blank" rel="noreferrer">🔗 ' + hl(u) + '</a>';
        });
        ls += '</div>';
        inner += ls;
      }
      if(isWboxCard && !imgs.length) inner += '<div class="vid">（动图表情，未能保存）</div>';
    }

    if(m.type === 'video') inner += '<div class="vid">▶ 视频（备份中保存了封面图）</div>';
    if(m.type === 'voice') inner += '<div class="vid">🎙 语音消息（备份中保存了封面图）</div>';

    /* 内容为空时的类型兜底占位（[文字] / [图片] / …）。
       ⚠ 被「隐藏自动回复」挡掉正文的消息**不能**走这个兜底：它本来就没别的可显示，
         兜底一出就变成「一个只剩 [文字]、看不出来是什么」的气泡
         —— 这正是 2026-09-16 用户报的那个 bug。
       autoMuted 那一支是**防御性的**：按现在的策略（上下文里直接 ctxMuted 跳过 +
       列表里 applyFilter 排除），它其实走不到。留着是为了万一以后改成
       「上下文里显示占位」,不会又退回 [文字]。 */
    var cls;
    if(isHidMsg){
      /* 单独隐藏：整条只留虚线占位条。正文 / 图片 / 卡片 / 链接一律不进 DOM，
         所以隐藏之后不管搜什么词都带不出内容。 */
      inner = '<span>🙈 这条消息已隐藏</span>' +
              '<button class="hbtn" type="button" title="恢复这条消息">恢复</button>';
      cls = 'hidb';
    } else {
      if(!inner) inner = autoMuted
        ? '<span class="mutedph">🙈 自动回复已隐藏</span>'
        : '<span style="opacity:.6">[' + esc(TYPE_LABEL[m.type] || m.type) + ']</span>';
      cls = 'bubble' + (imgs.length && !txt ? ' plain' : '') +
            ((isWeiboCard || isBiliCard) ? ' has-card' : '');
    }
    var wrap = 'msg' + (isMe ? ' me' : '') +
               (opt.inctx ? ' ctx' : '') +
               (isExpand ? ' hit' : '') +
               (isCtxHit ? ' hitsoft' : '');
    return '<div class="' + wrap + '"' +
      (m._ai == null ? '' : ' data-ai="' + m._ai + '"') +
      (idx == null ? '' : ' data-i="' + idx + '"') + '>' + avatar(m) +
      '<div class="body"><div class="meta"><span>' + esc(isMe ? (META.self_name || '我') : (META.peer_name || 'TA')) + '</span>' +
      '<span title="' + esc(fmt(m.ts)) + '">' + hhmm(m.ts) + '</span>' +
      (isExpand ? '<span class="hitbadge" title="这是你搜索命中的那条消息">命中</span>' : '') +
      (isCtxHit ? '<span title="这条也是搜索结果，只是不在你展开的那条旁边">· 命中</span>' : '') +
      '</div>' +
      '<div class="' + cls + '"' +
        (isHidMsg ? ' data-unhide="' + esc(mId(m)) + '" title="点击恢复这条消息"' : '') + '>' +
        inner + '</div>' +
      ctxBar(m, opt) + '</div></div>';
  }

  /* ---------- 搜索结果：展开上下文 ----------
     搜索结果里每条命中的消息都是孤立的，看不到它前后的对话。
     点消息下方的「↕ 展开上下文」，就把这条消息在【完整会话】里的
     相邻消息一并显示出来（上下文不受当前搜索/筛选条件影响，
     显示的是真实的原始对话）。 */
  var CTX_FIRST = 3;    // 首次展开：前后各 3 条
  var CTX_STEP  = 5;    // 之后每点一次「加载更多」：该侧再 +5 条

  // 命中消息下方的操作条
  function ctxBar(m, opt){
    if(!opt.hit || !st.q || !st.list.length) return '';
    var ai = m._ai;
    if(ai == null) return '';
    var ex = st.ctx[ai];
    if(!ex){
      return '<div class="ctxbar"><button type="button" data-ctx="open" data-ai="' + ai +
             '" title="显示这条消息在完整会话中的前后对话">↕ 展开上下文 <i>前后各 ' + CTX_FIRST + ' 条</i></button></div>';
    }
    var upRoom = ai - ex.up, downRoom = (ALL.length - 1 - ai) - ex.down;
    return '<div class="ctxbar">' +
      '<span class="ctxnum" title="上下文来自完整会话，不受当前搜索/筛选影响">已展开：更早 ' +
        ex.up + ' 条 · 更晚 ' + ex.down + ' 条</span>' +
      (upRoom > 0 ? '<button type="button" data-ctx="more1" data-owners="' + ai +
        '" data-dir="up" title="再往前看 ' + Math.min(CTX_STEP, upRoom) + ' 条">↑ 更早 <i>+' +
        Math.min(CTX_STEP, upRoom) + '</i></button>' : '') +
      (downRoom > 0 ? '<button type="button" data-ctx="more1" data-owners="' + ai +
        '" data-dir="down" title="再往后看 ' + Math.min(CTX_STEP, downRoom) + ' 条">↓ 更晚 <i>+' +
        Math.min(CTX_STEP, downRoom) + '</i></button>' : '') +
      '<button type="button" data-ctx="close" data-ai="' + ai + '">收起</button></div>';
  }

  // 上下文区块两端的分隔条：还能加载就出按钮，到头了就出提示
  function ctxBarHtml(it){
    var isUp = it.dir === 'up', left = 1e9;
    for(var i = 0; i < it.owners.length; i++){
      var o = it.owners[i], ex = st.ctx[o];
      if(!ex) continue;
      var l = isUp ? (o - ex.up) : (ALL.length - 1 - o - ex.down);
      if(l < left) left = l;                 // 取最保守的那个，保证点了不会「假加载」
    }
    if(!it.owners.some(function(o){ return st.ctx[o]; })) return '';
    if(left <= 0){
      return '<div class="ctxmore"><span class="ctxend">' +
             (isUp ? '↑ 这已经是你们最早的对话' : '↓ 这已经是最后一条消息') + '</span></div>';
    }
    return '<div class="ctxmore"><button type="button" data-ctx="more1" data-owners="' +
           it.owners.join(',') + '" data-dir="' + it.dir + '">' +
           (isUp ? '↑ 加载更早的上下文' : '↓ 加载更晚的上下文') +
           ' <i>+' + Math.min(CTX_STEP, left) + ' 条</i></button></div>';
  }

  // 把「窗口内的搜索结果」和「已展开的上下文」合并成一条按会话顺序排列的清单。
  // 同一条消息只出现一次；若它同时是搜索结果，会保留命中标记。
  function buildItems(start, end){
    var items = [], byAi = {};
    function put(ai, li, inctx){
      var it = byAi[ai];
      if(it){
        if(li != null){ it.hit = true; it.li = li; }
        if(inctx) it.inctx = true;
        return;
      }
      byAi[ai] = it = { k:'m', ai:ai, m:ALL[ai], li:(li == null ? null : li),
                        hit:(li != null), inctx:!!inctx };
      items.push(it);
    }
    // 分隔条按【位置】去重：两条命中的上下文窗口重叠时，
    // 同一条分隔条只画一次，点一下就为所有相关命中加载。
    function bar(pos, dir, owner){
      var key = dir + '@' + pos;
      var it = byAi[key];
      if(it){
        if(it.owners.indexOf(owner) < 0) it.owners.push(owner);
        return;
      }
      byAi[key] = it = { k:'bar', ai:pos, dir:dir, owners:[owner] };
      items.push(it);
    }
    var i, k, ai, ex, from, to;
    /* 上下文里要跳过的消息：
       · 自动回复 —— 「隐藏自动回复」开着时它在列表里已被排除，上下文再冒出来
         就自相矛盾；而且正文被 hideTxt 挡掉后只剩一个没意义的 [文字] 占位
         （2026-09-16 用户报的 bug：截图里就是这条路径）。
       · 单独隐藏的消息**不跳过** —— 留个占位条，用户才知道这里原本有内容、能点回来。 */
    function ctxMuted(k){
      var mm = ALL[k];
      return !!(mm && st.hideAuto && msgKind(mm) === 'auto');
    }
    for(i = start; i < end; i++){                       // 先登记所有搜索结果，
      var mm = st.list[i];                              // 后面才知道哪条上下文「也命中了」
      if(mm && mm._ai != null) put(mm._ai, i, false);
    }
    for(i = start; i < end; i++){
      var m = st.list[i];
      if(!m || m._ai == null) continue;
      ai = m._ai;
      ex = st.ctx[ai];
      if(!ex) continue;
      // 两条分隔条总是画出来：还能加载就出按钮，到会话首/尾就出提示
      from = Math.max(0, ai - ex.up);
      bar(from - 0.4, 'up', ai);
      for(k = from; k < ai; k++) if(!ctxMuted(k)) put(k, null, true);
      to = Math.min(ALL.length - 1, ai + ex.down);
      for(k = ai + 1; k <= to; k++) if(!ctxMuted(k)) put(k, null, true);
      bar(to + 0.4, 'down', ai);
    }
    items.sort(function(x, y){ return x.ai - y.ai; });
    return items;
  }

  function bindCtx(){
    Array.prototype.forEach.call(chat.querySelectorAll('[data-ctx]'), function(el){
      el.onclick = function(){
        var act = el.dataset.ctx, ai;
        if(act === 'open'){
          ai = +el.dataset.ai;
          st.ctx[ai] = { up:Math.min(CTX_FIRST, ai),
                         down:Math.min(CTX_FIRST, ALL.length - 1 - ai) };
          redrawCtx(ai);
        }else if(act === 'close'){
          ai = +el.dataset.ai;
          delete st.ctx[ai];
          redrawCtx(ai);
        }else{
          var owners = String(el.dataset.owners || '').split(',').map(Number)
                         .filter(function(o){ return st.ctx[o]; });
          var up = el.dataset.dir === 'up', anchor = null;
          owners.forEach(function(o){
            var ex = st.ctx[o];
            if(up) ex.up = Math.min(ex.up + CTX_STEP, o);
            else ex.down = Math.min(ex.down + CTX_STEP, ALL.length - 1 - o);
            if(anchor == null) anchor = o;
          });
          if(anchor != null) redrawCtx(anchor);
        }
      };
    });
  }

  // 重绘后把锚点消息钉回原来的位置，避免插入上下文导致视线跳动
  function redrawCtx(ai){
    var before = chat.querySelector('.msg[data-ai="' + ai + '"]');
    var top = before ? before.getBoundingClientRect().top : null;
    render();
    if(top == null) return;
    var after = chat.querySelector('.msg[data-ai="' + ai + '"]');
    if(!after) return;
    var d = after.getBoundingClientRect().top - top;
    if(d) window.scrollBy(0, d);
  }

  var chat = document.getElementById('chat');

  function render(keepScroll){
    var list = st.list;
    if(!list.length){ chat.innerHTML = '<div class="empty">没有匹配的消息</div>'; return; }
    var start = Math.max(0, st.win), end = Math.min(list.length, start + CHUNK);
    var html = '';
    if(start > 0) html += '<div class="more"><button id="moreTop">↑ 加载更早的 '+start.toLocaleString()+' 条</button></div>';
    var items = buildItems(start, end), last = null;
    for(var j=0;j<items.length;j++){
      var it = items[j];
      if(it.k === 'bar'){ html += ctxBarHtml(it); continue; }
      var m = it.m;
      var dk = m.ts ? dayKey(m.ts) : 'x';
      if(dk !== last){
        // data-m 取逻辑日的前 7 位 = 逻辑月，必须与 monthKey() 一致
        html += '<div class="day"' + (m.ts ? ' data-m="' + dk.slice(0,7) + '" title="' + esc(dayTip(dk)) + '"' : '') +
                '><span>' + (m.ts?dayLabel(m.ts):'时间未知') + '</span></div>';
        last = dk;
      }
      html += renderBubble(m, it.li, it);
    }
    if(end < list.length) html += '<div class="more"><button id="moreBot">↓ 还有 '+(list.length-end).toLocaleString()+' 条</button></div>';
    var prevH = chat.scrollHeight, prevTop = window.scrollY;
    chat.innerHTML = html;
    fixAvatars();
    fixImgs();
    bindCtx();
    var mt = document.getElementById('moreTop'), mb = document.getElementById('moreBot');
    if(mt) mt.onclick = function(){ st.win = Math.max(0, st.win - CHUNK); render(true); };
    if(mb) mb.onclick = function(){ st.win = st.win + CHUNK; render(true); };
    if(keepScroll && start > 0){ window.scrollTo(0, prevTop + (chat.scrollHeight - prevH)); }
  }

  function scrollToIndex(idx, block){
    var list = st.list;
    if(!list.length) return;
    idx = Math.max(0, Math.min(list.length - 1, idx));
    st.win = Math.max(0, Math.min(idx, list.length - CHUNK));
    if(list.length - st.win < CHUNK) st.win = Math.max(0, list.length - CHUNK);
    render();
    requestAnimationFrame(function(){
      var nodes = chat.querySelectorAll('.msg');
      var target = idx - st.win;
      if(nodes[target]){
        var y = nodes[target].getBoundingClientRect().top + window.scrollY - 130;
        window.scrollTo({ top: y, behavior: block || 'auto' });
        nodes[target].style.transition = 'background .8s';
      }
      highlightMonth(idx);
    });
  }

  /* ---------- 右侧时间轴（按月导航，宽屏显示） ---------- */
  var MONTHS = [], curMonth = null;

  function buildRail(){
    var box = document.getElementById('months');
    if(!box) return;
    var map = {}, order = [];
    st.list.forEach(function(m, i){
      if(!m.ts) return;
      var d = dayDate(m.ts);                 // 月份归属也用「减 5 小时」的逻辑日期
      var k = ym(d);
      var o = map[k];
      if(!o){
        o = map[k] = { k:k, start:i, n:0, label:(d.getFullYear()+'年'+(d.getMonth()+1)+'月') };
        order.push(k);
      }
      o.n++;
    });
    MONTHS = order.map(function(k){ return map[k]; });
    var html = '';
    for(var i = MONTHS.length - 1; i >= 0; i--){
      var o = MONTHS[i];
      html += '<div class="mo" data-m="' + o.k + '" title="' + o.label + '（' + o.n + ' 条）">' +
              '<span>' + o.label + '</span><i>' + o.n + '</i></div>';
    }
    box.innerHTML = html || '<div class="mo" style="cursor:default">无</div>';
    Array.prototype.forEach.call(box.querySelectorAll('.mo[data-m]'), function(el){
      el.onclick = function(){ jumpMonth(el.dataset.m); };
    });
    curMonth = null;
    highlightMonth();
  }

  function jumpMonth(k){
    for(var i = 0; i < MONTHS.length; i++){
      if(MONTHS[i].k === k){ scrollToIndex(MONTHS[i].start, 'smooth'); return; }
    }
  }

  // 滚动时点亮当前所在月份；fallbackIdx 用于量不到坐标时（离线渲染）兜底
  function highlightMonth(fallbackIdx){
    var days = chat.querySelectorAll('.day[data-m]'), k = null, measurable = false;
    for(var i = 0; i < days.length; i++){
      var r = days[i].getBoundingClientRect();
      if(r.bottom) measurable = true;
      if(r.bottom > 96){ k = days[i].dataset.m; break; }
    }
    // 量不到真实坐标时，退回「目标消息 / 渲染窗口起点」所在月份
    if(!measurable){
      var m0 = st.list[fallbackIdx != null ? fallbackIdx : st.win];
      k = (m0 && m0.ts) ? monthKey(m0.ts) : (days.length ? days[days.length-1].dataset.m : null);
    }
    if(k === curMonth) return;
    curMonth = k;
    Array.prototype.forEach.call(document.querySelectorAll('#months .mo[data-m]'), function(el){
      el.classList.toggle('on', el.dataset.m === k);
    });
  }

  var railTick = 0;
  onWin('scroll', function(){
    if(railTick) return;
    railTick = requestAnimationFrame(function(){ railTick = 0; highlightMonth(); });
  }, {passive:true});

  /* ---------- 交互 ---------- */
  var qEl = document.getElementById('q');
  var t = null;
  qEl.addEventListener('input', function(){
    document.getElementById('qclr').style.display = qEl.value ? 'block' : 'none';
    clearTimeout(t);
    t = setTimeout(function(){
      st.q = qEl.value; st.win = 0; st.hitIdx = -1;
      applyFilter();
      if(st.q && st.list.length){ st.hitIdx = st.list.length - 1; scrollToIndex(st.hitIdx); }

  document.getElementById('qclr').onclick = function(){
    qEl.value = ''; document.getElementById('qclr').style.display='none';
    st.q=''; st.win=0; st.hitIdx=-1; applyFilter(); render(); updateHitNav();
  };
  // 在匹配结果之间跳动：↑ 更早、↓ 更新
  function gotoHit(dir){
    if(!st.list.length) return;
    if(st.hitIdx < 0) st.hitIdx = st.list.length - 1;
    else st.hitIdx = Math.max(0, Math.min(st.list.length - 1, st.hitIdx + dir));
    scrollToIndex(st.hitIdx, 'smooth');
    updateHitNav();
  }
  document.getElementById('hitPrev').onclick = function(){ gotoHit(-1); };
  document.getElementById('hitNext').onclick = function(){ gotoHit(1); };

  onDoc('keydown', function(e){
    if(e.key === '/' && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
    if(e.key === 'Escape'){ closeMenu(); closeLb(); if(document.activeElement===qEl) qEl.blur(); }
  });
  qEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); gotoHit(e.shiftKey ? -1 : 1); }
  });

  // 类型筛选（不含自动回复开关）
  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-f]'), function(c){
    c.onclick = function(){

  /* ---------- 高级筛选（P1-5）----------
     四个维度，全部与上面的快捷筛选、搜索词叠加生效：
       ① 消息类型：下拉项**从数据里现算**（不同数据集/会话的类型不一样，硬编码会漏）
       ② 日期区间：起止都含当天
       ③ 搜索词按正则解释（写错了退回普通匹配，不炸页面）
       ④ 只看「图内有字」/「有图描述」—— 复用本地 OCR / 图片描述索引
     全部纯本地内存运算，不发任何请求。 */
  (function initAdvFilter(){
    var selType = document.getElementById('advType');
    if(selType){
      var cnt = {}, label = {};
      ALL.forEach(function(m){
        var t = m.type || 'other';

        if(!label[t]) label[t] = TYPE_LABEL[t] || t;
      });
      Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; }).forEach(function(t){
        var o = document.createElement('option');

        selType.appendChild(o);
      });
      selType.value = 'all';
      selType.onchange = function(){
        st.type = this.value; st.win = 0; st.hitIdx = -1;
