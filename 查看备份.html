      };
    }

    var sinceEl = document.getElementById('advSince'), untilEl = document.getElementById('advUntil');
    function onDate(){
      // 起止写反了自动对调，别让人对着空结果发愣
      if(sinceEl.value && untilEl.value && sinceEl.value > untilEl.value){
        var tmp = sinceEl.value; sinceEl.value = untilEl.value; untilEl.value = tmp;
      }
      st.since = sinceEl.value; st.until = untilEl.value;
      st.win = 0; st.hitIdx = -1;
      applyFilter();
      if(st.list.length) scrollToIndex(st.list.length - 1); else render();
    }
    if(sinceEl) sinceEl.onchange = onDate;
    if(untilEl) untilEl.onchange = onDate;

    [['advRegex','regex'], ['advOcr','onlyOcr'], ['advVlm','onlyVlm']].forEach(function(pair){
      var el = document.getElementById(pair[0]);
      if(!el) return;
      el.onclick = function(){
        st[pair[1]] = !st[pair[1]];
        el.setAttribute('aria-pressed', st[pair[1]] ? 'true' : 'false');
        st.win = 0; st.hitIdx = -1;
        applyFilter();
        if(st.list.length) scrollToIndex(st.list.length - 1); else render();
      };
    });

    var rst = document.getElementById('advReset');
    if(rst) rst.onclick = function(){ resetAllFilters(); };
  })();

  /* 清空全部条件：搜索词 / 快捷筛选 / 高级筛选 / 自动回复开关 */
  function resetAllFilters(){
    st.q = ''; st.filter = 'all'; st.type = 'all';
    st.since = ''; st.until = '';
    st.regex = false; st.onlyOcr = false; st.onlyVlm = false;
    st.hideAuto = false; st.win = 0; st.hitIdx = -1; st.ctx = {};
    try{ localStorage.setItem('dm-hide-auto-' + SRC.key, '0'); }catch(e){}
    qEl.value = ''; document.getElementById('qclr').style.display = 'none';
    var ty = document.getElementById('advType');  if(ty) ty.value = 'all';

    updateHitNav();

  // 一键隐藏 / 显示对方的自动回复
  function setHideAuto(v){
    st.hideAuto = !!v;
    st.win = 0; st.hitIdx = -1;
    try{ localStorage.setItem('dm-hide-auto-' + SRC.key, st.hideAuto ? '1' : '0'); }catch(e){}
    updateAutoChip();

  }
  document.getElementById('autoChip').onclick = function(){ setHideAuto(!st.hideAuto); };
  document.getElementById('hidChip').onclick = function(){ armRestoreAll(); };
  refreshHidden();

  /* ==========================================================
     右键菜单：「隐藏这条消息」
     ----------------------------------------------------------
     · 菜单节点挂在 .layout 里 —— resetDom() 换掉 .layout 之后它自然消失，
       下一次 boot 重建一份，不会跨数据源残留（#chat.innerHTML 重绘也不影响它）。
     · 事件委托挂到 document 上（用 onDoc 记账，切数据源时会摘掉），
       所以行节点被重绘多少次都不用重新绑定。
     ========================================================== */
  var LAYOUT = document.querySelector('.layout');
  var menuEl = document.createElement('div');
  menuEl.className = 'cmenu';
  menuEl.hidden = true;
  menuEl.innerHTML =
    '<button type="button" data-act="hide"></button>' +
    '<div class="sep"></div>' +
    '<button type="button" data-act="copy">📋 复制文本</button>';
  LAYOUT.appendChild(menuEl);

  var menuAi = null, suppressClick = 0;
  function closeMenu(){
    if(menuEl.hidden) return;
    menuEl.hidden = true;
    menuAi = null;
  }
  function openMenu(ai, x, y){
    var m = ALL[ai];
    if(!m) return;
    menuAi = ai;
    var hid = isHid(m);
    var hb = menuEl.querySelector('[data-act="hide"]');
    hb.textContent = hid ? '↩ 恢复这条消息' : '🙈 隐藏这条消息';
    hb.disabled = !mId(m);                    // 没有稳定 id 就不给隐藏（理论上不存在）
    menuEl.querySelector('[data-act="copy"]').disabled = !(m.text || '');
    menuEl.hidden = false;
    var r = menuEl.getBoundingClientRect();   // 先量再定位，避免菜单被视口裁掉
    menuEl.style.left = Math.max(6, Math.min(x, window.innerWidth  - r.width  - 6)) + 'px';
    menuEl.style.top  = Math.max(6, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
    /* 触屏长按结束时浏览器还会补一个 click，别让它顺手把刚弹出的菜单关掉 */
    suppressClick = Date.now() + 420;
  }

  /* 隐藏/恢复都要「重算列表但不丢上下文」：
     applyFilter() 会把 st.ctx 清空（那是有意为之：换了搜索词就重来），
     但这里只是藏/放了一条消息，把用户好不容易展开的上下文弄没了很烦。 */
  function refilterKeepCtx(){
    var keep = st.ctx;
    applyFilter();
    st.ctx = keep;
    render();
  }

  menuEl.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('button[data-act]') : null;
    if(!b || b.disabled) return;
    var ai = menuAi, act = b.dataset.act;
    closeMenu();
    var m = (ai == null) ? null : ALL[ai];
    if(!m) return;
    if(act === 'hide'){
      var wasHid = isHid(m);
      if(!setHidden(m, !wasHid)) return;
      refilterKeepCtx();
      if(wasHid){
        // 恢复了就把它滚进视野，否则「点了没反应」很容易被当成没生效
        var li = st.list.indexOf(m);
        if(li >= 0) scrollToIndex(li);
      }
      toast(wasHid ? '已恢复这条消息'
                   : '已隐藏这条消息 · 想找回来点侧栏「🙈 已隐藏」');
    } else if(act === 'copy'){
      toast(copyText(m.text || '') ? '已复制到剪贴板' : '复制失败，请手动选中文字');
    }
  });

  function copyText(s){
    s = String(s == null ? '' : s);
    if(!s) return false;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(s);
        return true;
      }
    }catch(e){}
    try{
      var ta = document.createElement('textarea');
      ta.value = s;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      if(ta.setSelectionRange) ta.setSelectionRange(0, ta.value.length);
      var ok = document.execCommand('copy');
      ta.parentNode.removeChild(ta);
      return !!ok;
    }catch(e){ return false; }
  }

  onDoc('contextmenu', function(ev){
    var row = (ev.target && ev.target.closest) ? ev.target.closest('#chat .msg[data-ai]') : null;
    if(!row){ closeMenu(); return; }   // 右键别处：不拦，浏览器原生菜单照常出现
    ev.preventDefault();
    openMenu(+row.dataset.ai, ev.clientX, ev.clientY);
  });

  /* 点占位条 = 恢复这条消息；点别处 = 收起菜单 */
  onDoc('click', function(ev){
    if(Date.now() < suppressClick) return;
    var un = (ev.target && ev.target.closest) ? ev.target.closest('[data-unhide]') : null;
    if(un){ restoreOne(un.dataset.unhide); closeMenu(); return; }
    closeMenu();
  });

  /* 触屏没有右键：长按 550ms 弹同一个菜单。
     全程不 preventDefault，手指一移动（>10px，判定为滚动）就取消，不影响正常滚动。 */
  var lpTimer = null, lpX = 0, lpY = 0;
  function lpCancel(){ clearTimeout(lpTimer); lpTimer = null; }
  onDoc('touchstart', function(ev){
    var t0 = ev.touches && ev.touches[0];
    var row = (t0 && ev.target && ev.target.closest) ? ev.target.closest('#chat .msg[data-ai]') : null;
    if(!t0 || !row) return;
    lpX = t0.clientX; lpY = t0.clientY;
    var ai = +row.dataset.ai;
    lpCancel();
    lpTimer = setTimeout(function(){ lpCancel(); openMenu(ai, lpX, lpY); }, 550);
  }, { passive:true });
  onDoc('touchmove', function(ev){
    var t0 = ev.touches && ev.touches[0];
    if(!lpTimer || !t0) return;
    if(Math.abs(t0.clientX - lpX) > 10 || Math.abs(t0.clientY - lpY) > 10) lpCancel();
  }, { passive:true });
  onDoc('touchend', lpCancel);
  onDoc('touchcancel', lpCancel);
  onWin('resize', closeMenu);
  onWin('scroll', closeMenu);
  document.getElementById('jump').onchange = function(){
    var v = this.value; if(!v) return;
    // 跳到某个「逻辑日」= 该日 05:00 起；沿用同一套边界，别在这里另开口径
    var target = dayStartTs(v);
    if(!target) return;
    var list = st.list;
    for(var i=0;i<list.length;i++){ if(list[i].ts && list[i].ts >= target){ scrollToIndex(i, 'smooth'); return; } }
    scrollToIndex(list.length - 1, 'smooth');
  };
  function goTop(){ st.win = 0; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  function goBot(){ scrollToIndex(st.list.length - 1, 'smooth'); }
  ['toTop','toTop2'].forEach(function(id){ var el = document.getElementById(id); if(el) el.onclick = goTop; });
  ['toBot','toBot2'].forEach(function(id){ var el = document.getElementById(id); if(el) el.onclick = goBot; });
  document.getElementById('themeBtn').onclick = function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nx);
    try{ localStorage.setItem('dm-theme', nx); }catch(e){}
  };
  try{
    var saved = localStorage.getItem('dm-theme');
    if(saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}

  /* ==========================================================
     按天互动统计
     ----------------------------------------------------------
     口径（全部在数据上核对过，数字实时来自本地备份）：
       · 时间归属：消息时间戳 → 本机时区自然日 YYYY-MM-DD，一日一条，不跨日拆分
       · 归属判定：接口返回的 from 字段（me / peer），不靠昵称或文案猜测
       · 排除 3 类：自动回复、送礼物·助威通知、系统提示「你撤回了一条消息」
       · 计入：文字、图片、分享微博卡片、视频/语音、动图表情、链接等全部真实消息
     ========================================================== */
  var RE_GIFT   = /^感谢您的助威支持|助威权益还有\d+天|^发出红包消息/;      // 送礼物/助威的系统通知
  var RE_SYSTIP = /^(?:你|对方)撤回了一条消息$/;                             // 撤回提示，非发言内容

  /* 一条消息算不算「真实发言」：
     · 微博：接口没有「是否自动回复」字段，只能按接口原文精确匹配（3 类）
     · B站 ：接口自带 msg_source，可以直接结构化判定，比猜文案可靠得多
             msg_source 8=关注后 9=收到消息 10=关键词 11=大航海 → 自动回复
                        17=互关自动消息      16=系统
             msg_type   16=关注后的自动推送    5=撤回    18=系统提示
                        10=官方通知 13=图片卡片 301~306=粉丝团提示 */
  function msgKind(m){
    if(SRC.key === 'bili'){
      /* 实测口径（2026-09-15 首次全量 2,912 条）msg_type 只出现 1/2/5/6/7/10/14：
           1=文字  2=图片  5=撤回  6=自定义表情  7=分享视频·相簿·专栏  10=官方通知  14=分享直播
         下面 13 / 16 / 18 / 301~306 属防御性保留（别的会话可能出现，本会话未触发）。
         ⚠ 分享卡片（7 / 14）算**真实发言**，与微博口径一致 —— 微博那边分享卡片也是计入的；
           它们 content 里没有正文，全在 card.title，靠 haystack() 纳入搜索。 */
      var s = m.msg_source | 0, mt = m.media_type;
      if((s >= 8 && s <= 11) || s === 17) return 'auto';   // 关注后 / 收到消息 / 关键词 / 大航海 / 互关
      if(mt === 16) return 'auto';                          // 关注后的自动推送
      if(mt === 5 || mt === 10 || mt === 18) return 'sys';  // 撤回提示 + 官方通知（开播 / 视频上线 / 预约成功）
      if(mt === 13) return 'gift';
      if(mt >= 301 && mt <= 306) return 'gift';             // 粉丝团 / 大航海提示
      if(m.from !== 'me' && m.from !== 'peer') return 'gift';
      return 'count';
    }
    var t = (m.text || '').trim();
    if(t === AUTO_REPLY) return 'auto';
    if(RE_GIFT.test(t)) return 'gift';
    if(RE_SYSTIP.test(t)) return 'sys';
    return 'count';
  }

  var DAILY = null;
  function buildDaily(){
    if(DAILY) return DAILY;
    var map = {}, excl = { auto:0, autoMe:0, autoPeer:0, gift:0, giftPeer:0, giftMe:0, sys:0, sysMe:0, sysPeer:0 };
    var tmin = Infinity, tmax = -Infinity, noTs = 0;
    /* 落在 00:00~05:00、因而归属「前一天」的消息数。
       注意口径：**按全部消息**统计，不先剔掉自动回复 / 系统通知 ——
       这个数字要回答的是「换日口径影响了多少条」，而不是「计入了多少条」，
       所以刻意放在类型判断之前（口径说明里会把它报出来，也会被回归测试核对）。 */
    var pre5 = 0;
    ALL.forEach(function(m){
      if(!m.ts){ noTs++; return; }
      if(m.ts < tmin) tmin = m.ts;
      if(m.ts > tmax) tmax = m.ts;
      if(new Date(m.ts).getHours() < DAY_CUT_H) pre5++;
      var kind = msgKind(m);
      if(kind !== 'count'){
        excl[kind]++;
        if(kind === 'auto'){ if(m.from === 'me') excl.autoMe++; else excl.autoPeer++; }
        if(kind === 'gift'){ if(m.from === 'me') excl.giftMe++; else excl.giftPeer++; }
        if(kind === 'sys'){ if(m.from === 'me') excl.sysMe++; else excl.sysPeer++; }
        return;
      }
      if(m.from !== 'me' && m.from !== 'peer') return;
      var k = dayKey(m.ts), o = map[k] || (map[k] = { me:0, peer:0 });
      o[m.from]++;
    });
    /* 连续日期轴：按**逻辑日**逐日补齐，没有消息的日子补 0，保证折线的时间间隔真实。
       起点/终点都由 dayKey() 定位，再走 dayNoon() 逐日 +1 —— 不要拿 tmin/tmax 直接
       setHours(0,0,0,0)：那是自然日的算法，会和 dayKey() 差一天。 */
    var dates = [], me = [], peer = [];
    var cur = dayNoon(dayKey(tmin)), lastD = dayNoon(dayKey(tmax));
    while(cur && lastD && cur.getTime() <= lastD.getTime()){
      var kk = ymd(cur), oo = map[kk];
      dates.push(kk); me.push(oo ? oo.me : 0); peer.push(oo ? oo.peer : 0);
      cur.setDate(cur.getDate() + 1);
    }
    var tot = { me:0, peer:0, days:dates.length, activeMe:0, activePeer:0, both:0, zero:0, pre5:pre5 };
    for(var i = 0; i < dates.length; i++){
      tot.me += me[i]; tot.peer += peer[i];
      if(me[i]) tot.activeMe++;
      if(peer[i]) tot.activePeer++;
      if(me[i] && peer[i]) tot.both++;
      if(!me[i] && !peer[i]) tot.zero++;
    }
    DAILY = { dates:dates, me:me, peer:peer, excl:excl, noTs:noTs, tot:tot };
    return DAILY;
  }

  // 7 日移动平均（开头不足 7 天的位置留空，不画）
  function movingAvg(arr, n){
    var out = new Array(arr.length), sum = 0;
    for(var i = 0; i < arr.length; i++){
      sum += arr[i];
      if(i >= n) sum -= arr[i - n];
      out[i] = i >= n - 1 ? sum / n : null;
    }
    return out;
  }

  var stt = { range:0, avg:true, dual:true };
  var GEO = null;

  function statSlice(){
    var D = buildDaily(), n = D.dates.length;
    var from = stt.range > 0 ? Math.max(0, n - stt.range) : 0;
    return { dates:D.dates.slice(from), me:D.me.slice(from), peer:D.peer.slice(from), D:D };
  }

  function renderKpis(S){
    var n = S.dates.length, sMe = 0, sPeer = 0, both = 0, zero = 0, peakMe = 0, peakDay = S.dates[0] || '';
    for(var i = 0; i < n; i++){
      sMe += S.me[i]; sPeer += S.peer[i];
      if(S.me[i] && S.peer[i]) both++;
      if(!S.me[i] && !S.peer[i]) zero++;
      if(S.me[i] > peakMe){ peakMe = S.me[i]; peakDay = S.dates[i]; }
    }
    var avg = function(v){ return n ? (v / n).toFixed(1) : '0'; };
    document.getElementById('kpis').innerHTML =
      '<div class="kpi me"><b>' + sMe.toLocaleString() + '<i>条</i></b><span>我发出 · 日均 ' + avg(sMe) + ' 条</span></div>' +
      '<div class="kpi peer"><b>' + sPeer.toLocaleString() + '<i>条</i></b><span>' + esc(PEER_LABEL) + '回复 · 日均 ' + avg(sPeer) + ' 条</span></div>' +
      '<div class="kpi"><b>' + both.toLocaleString() + '<i>/ ' + n.toLocaleString() + ' 天</i></b><span>有来有回（当天双方都发过）</span></div>' +
      '<div class="kpi"><b>' + peakMe.toLocaleString() + '<i>条</i></b><span>我的单日峰值 · ' + esc(peakDay) + '</span></div>';
    document.getElementById('statRange').textContent =
      (S.dates[0] || '') + ' ~ ' + (S.dates[n - 1] || '') + '　共 ' + n.toLocaleString() + ' 天' +
      (zero ? '（' + zero.toLocaleString() + ' 天无消息）' : '') +
      '　· 按每天 ' + DAY_CUT_S + ' 分界';
  }

  function drawChart(){
    var S = statSlice(), cv = document.getElementById('chart'), wrap = document.getElementById('chartwrap');
    var n = S.dates.length;
    if(!n){ cv.innerHTML = ''; GEO = null; return; }
    var W = Math.max(300, wrap.clientWidth - 12), H = 320;
    var padL = 44, padR = stt.dual ? 44 : 16, padT = 22, padB = 30;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var step = n > 1 ? plotW / (n - 1) : 0;
    var maxMe = 1, maxPeer = 1;
    for(var i = 0; i < n; i++){ if(S.me[i] > maxMe) maxMe = S.me[i]; if(S.peer[i] > maxPeer) maxPeer = S.peer[i]; }
    var maxY = Math.max(maxMe, maxPeer);                 // 同轴：共用一套刻度
    var maxY2 = stt.dual ? maxPeer : maxY;               // 独立量程：右轴给对方
    var X = function(i){ return padL + i * step; };
    var Y = function(v, mx){ return padT + (1 - v / mx) * plotH; };

    function linePath(arr, mx){
      var d = '', on = false;
      for(var i = 0; i < arr.length; i++){
        var v = arr[i];
        if(v == null){ on = false; continue; }
        d += (on ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v, mx).toFixed(1) + ' ';
        on = true;
      }
      return d;
    }
    function areaPath(arr, mx){
      var a = -1, b = -1;
      for(var i = 0; i < arr.length; i++){ if(arr[i] != null){ if(a < 0) a = i; b = i; } }
      if(a < 0) return '';
      var yb = (H - padB).toFixed(1);
      return linePath(arr, mx) + 'L' + X(b).toFixed(1) + ' ' + yb + ' L' + X(a).toFixed(1) + ' ' + yb + ' Z';
    }

    var meDraw = stt.avg ? movingAvg(S.me, 7) : S.me;
    var peerDraw = stt.avg ? movingAvg(S.peer, 7) : S.peer;
    var rawOpacity = stt.avg ? '0.5' : '1';
    var rawWidth = stt.avg ? '1' : '1.6';

    var g = '';
    // 注意：SVG 的 presentation attribute（fill="var(--x)"）在 Chrome 里不解析 CSS 变量，
    // 颜色一律走 style=""，主题切换才能实时生效。
    // 横向网格 + 左轴刻度
    for(var k = 0; k <= 4; k++){
      var yy = padT + plotH * (1 - k / 4);
      g += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + yy.toFixed(1) +
           '" style="stroke:var(--line);stroke-width:1' + (k ? ';stroke-dasharray:3 4' : '') + '"/>';
      g += '<text x="' + (padL - 7) + '" y="' + (yy + 4).toFixed(1) +
           '" text-anchor="end" style="font-size:10.5px;fill:var(--muted)">' +
           Math.round(maxY * k / 4) + '</text>';
    }
    if(stt.dual){
      for(var k2 = 0; k2 <= 4; k2++){
        var y2 = padT + plotH * (1 - k2 / 4);
        g += '<text x="' + (W - padR + 7) + '" y="' + (y2 + 4).toFixed(1) +
             '" style="font-size:10.5px;fill:var(--muted)">' + Math.round(maxY2 * k2 / 4) + '</text>';
      }
    }
    // 轴标题放顶部左右角（放底部会和 X 轴日期刻度撞在一起）
    if(stt.dual){
      g += '<text x="' + padL + '" y="13" style="font-size:10.5px;font-weight:600;fill:var(--c-me)">我（条/天）</text>';
      g += '<text x="' + (W - padR) + '" y="13" text-anchor="end" style="font-size:10.5px;font-weight:600;fill:var(--c-peer)">' + esc(PEER_LABEL) + '（条/天）</text>';
    } else {
      g += '<text x="' + padL + '" y="13" style="font-size:10.5px;fill:var(--muted)">两条同轴 · 条/天</text>';
    }
    // X 轴日期刻度：按可用宽度决定个数，窄屏才不会挤成一团
    var maxTicks = Math.max(2, Math.min(6, Math.floor(plotW / 70)));
    var ticks = n < 2 ? 1 : Math.min(maxTicks, n);
    for(var t = 0; t < ticks; t++){
      var idx = ticks === 1 ? 0 : Math.round((n - 1) * t / (ticks - 1));
      var anchor = t === 0 ? 'start' : (t === ticks - 1 ? 'end' : 'middle');
      g += '<text x="' + X(idx).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="' + anchor +
           '" style="font-size:10.5px;fill:var(--muted)">' + esc(S.dates[idx].slice(2)) + '</text>';
    }
    // 渐变填充 + 折线
    g += '<defs>' +
      '<linearGradient id="gMe" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" style="stop-color:var(--c-me);stop-opacity:0.46"/>' +
        '<stop offset="100%" style="stop-color:var(--c-me);stop-opacity:0.02"/></linearGradient>' +
      '<linearGradient id="gPeer" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" style="stop-color:var(--c-peer);stop-opacity:0.46"/>' +
        '<stop offset="100%" style="stop-color:var(--c-peer);stop-opacity:0.02"/></linearGradient>' +
      '</defs>';
    g += '<path d="' + areaPath(S.me, maxY) + '" style="fill:url(#gMe)"/>';
    g += '<path d="' + areaPath(S.peer, maxY2) + '" style="fill:url(#gPeer)"/>';
    g += '<path d="' + linePath(S.me, maxY) + '" style="fill:none;stroke:var(--c-me);stroke-width:' + rawWidth +
         ';stroke-opacity:' + rawOpacity + ';stroke-linejoin:round"/>';
    g += '<path d="' + linePath(S.peer, maxY2) + '" style="fill:none;stroke:var(--c-peer);stroke-width:' + rawWidth +
         ';stroke-opacity:' + rawOpacity + ';stroke-linejoin:round"/>';
    if(stt.avg){
      g += '<path d="' + linePath(meDraw, maxY) + '" style="fill:none;stroke:var(--c-me);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/>';
      g += '<path d="' + linePath(peerDraw, maxY2) + '" style="fill:none;stroke:var(--c-peer);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round"/>';
    }
    // 悬停辅助元素
    g += '<line id="hovline" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) +
         '" style="stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3" opacity="0"/>';
    g += '<circle id="hovdotM" r="3.5" style="fill:var(--c-me);stroke:var(--panel);stroke-width:1.5" opacity="0"/>';
    g += '<circle id="hovdotP" r="3.5" style="fill:var(--c-peer);stroke:var(--panel);stroke-width:1.5" opacity="0"/>';
    // 透明命中层：保证鼠标在图表空白处也能触发悬停/点击
    g += '<rect x="' + padL + '" y="' + padT + '" width="' + plotW.toFixed(1) + '" height="' + plotH.toFixed(1) +
         '" style="fill:transparent;pointer-events:all;cursor:crosshair"/>';

    cv.setAttribute('width', W);
    cv.setAttribute('height', H);
    cv.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    cv.innerHTML = g;
    GEO = { W:W, H:H, padL:padL, padR:padR, padT:padT, padB:padB, step:step, n:n, maxY:maxY, maxY2:maxY2, S:S, hoverIdx:null };
    renderHint(S, maxY, maxY2);
  }

  // 一句话说明当前量程模式，避免「对方线为什么贴底 / 为什么这么高」的误读
  function renderHint(S, maxY, maxY2){
    var el = document.getElementById('chartHint');
    if(!el) return;
    var mMax = 0, pMax = 0;
    for(var i = 0; i < S.me.length; i++){
      if(S.me[i] > mMax) mMax = S.me[i];
      if(S.peer[i] > pMax) pMax = S.peer[i];
    }
    var msg = '';
    if(stt.dual && pMax && mMax){
      msg = '两条线各自缩放：<b>左轴=我</b>（最高 ' + mMax + ' 条/天）、<b>右轴=' + esc(PEER_LABEL) + '</b>（最高 ' + pMax +
            ' 条/天），看的是<b>趋势形状</b>；要比较真实量级请关掉「独立量程」。';
    } else if(!pMax && !mMax){
      msg = '这个区间里双方都没有消息。';
    } else if(mMax && pMax / mMax < 0.25){
      msg = '同轴对比：' + esc(PEER_LABEL) + '单日最高 ' + pMax + ' 条、我 ' + mMax + ' 条，' + esc(PEER_LABEL) + '那条几乎贴在底部 —— 点「独立量程」可展开看它的走势。';
    } else if(!pMax){
      msg = '同轴对比：这个区间里' + esc(PEER_LABEL) + '没有回复（同期我发出 ' + mMax + ' 条/天 峰值）。';
    } else {
      msg = '同轴对比：区间内我最高 ' + mMax + ' 条/天、' + esc(PEER_LABEL) + '最高 ' + pMax + ' 条/天。';
    }
    el.innerHTML = msg + '<span class="cutnote">' + esc(DAY_CUT_NOTE) + '</span>';
    el.classList.toggle('on', !!msg);
  }

  function chartHover(clientX){
    if(!GEO || !GEO.n) return;
    var r = document.getElementById('chart').getBoundingClientRect();
    var mx = clientX - r.left;
    var i = GEO.step > 0 ? Math.round((mx - GEO.padL) / GEO.step) : 0;
    i = Math.max(0, Math.min(GEO.n - 1, i));
    GEO.hoverIdx = i;
    var S = GEO.S, H = GEO.H, plotH = H - GEO.padT - GEO.padB;
    var x = GEO.padL + i * GEO.step;
    var yM = GEO.padT + (1 - S.me[i] / GEO.maxY) * plotH;
    var yP = GEO.padT + (1 - S.peer[i] / GEO.maxY2) * plotH;
    var set = function(id, attrs){
      var el = document.getElementById(id); if(!el) return;
      for(var a in attrs) el.setAttribute(a, attrs[a]);
      el.setAttribute('opacity', '1');
    };
    set('hovline', { x1:x, x2:x });
    set('hovdotM', { cx:x, cy:yM });
    set('hovdotP', { cx:x, cy:yP });
    var d = dayNoon(S.dates[i]);        // key 就是逻辑日，取正午求星期最稳
    var w = ['日','一','二','三','四','五','六'][d.getDay()];
    var tip = document.getElementById('tip');
    tip.innerHTML = '<b>' + esc(S.dates[i]) + '</b> 星期' + w +
      '<br><span class="mutedph">' + esc(DAY_CUT_NOTE) + '</span>' +
      '<br><span class="dot" style="background:var(--c-me)"></span>我发出 <b>' + S.me[i] + '</b> 条' +
      '<br><span class="dot" style="background:var(--c-peer)"></span>' + esc(PEER_LABEL) + '回复 <b>' + S.peer[i] + '</b> 条';
    tip.classList.add('on');
    var wrap = document.getElementById('chartwrap');
    var tw = tip.offsetWidth, ww = wrap.clientWidth;
    var left = x + 14;
    if(left + tw > ww - 4) left = x - tw - 14;
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = Math.max(4, Math.min(yM, yP) - 8) + 'px';
  }

  // 点图上的某天 → 跳到那天的聊天记录
  function jumpToDate(k){
    var find = function(){
      for(var i = 0; i < st.list.length; i++){
        if(st.list[i].ts && dayKey(st.list[i].ts) === k) return i;
      }
      return -1;
    };
    var i = find();
    if(i < 0){
      // 被当前搜索 / 筛选（含高级筛选）滤掉了：先清空条件再找
      st.q = ''; st.filter = 'all'; st.type = 'all';
      st.since = ''; st.until = '';
      st.regex = false; st.onlyOcr = false; st.onlyVlm = false;
      st.hitIdx = -1;
      qEl.value = ''; document.getElementById('qclr').style.display = 'none';
      var ty = document.getElementById('advType');  if(ty) ty.value = 'all';
      var sd = document.getElementById('advSince'); if(sd) sd.value = '';
      var ud = document.getElementById('advUntil'); if(ud) ud.value = '';
      ['advRegex','advOcr','advVlm'].forEach(function(id){
        var el = document.getElementById(id); if(el) el.setAttribute('aria-pressed','false');
      });
      Array.prototype.forEach.call(document.querySelectorAll('.chip[data-f]'), function(x){
        x.setAttribute('aria-pressed', x.dataset.f === 'all' ? 'true' : 'false');
      });
      applyFilter();
      i = find();
    }
    closeStat();
    if(i >= 0) scrollToIndex(i, 'smooth');
  }

  var chartEl = document.getElementById('chart');
  chartEl.addEventListener('mousemove', function(e){ chartHover(e.clientX); });
  chartEl.addEventListener('mouseleave', hideHover);
  chartEl.addEventListener('click', function(){ if(GEO && GEO.hoverIdx != null) jumpToDate(GEO.S.dates[GEO.hoverIdx]); });

    if(document.getElementById('stat').classList.contains('on')) drawChart();
  });

  /* ---------- 灯箱 ---------- */
  var lb = document.getElementById('lb'), lbi = document.getElementById('lbimg'),

  /* ==========================================================
     日历热力图（P1-8）
     ----------------------------------------------------------
     用已有的按天统计铺成方格：列 = 周（周一起始）、行 = 周一~周日。
     折线图只能看趋势，看不出「哪段时间聊得密、哪天断档」，方格一眼就看清。
     点任意格子直接跳到那天。
     纯本地渲染，不联网。
     ========================================================== */
  var hmMetric = 'all';                                   // all | me | peer

  function renderHeat(){
    var el = document.getElementById('heat');
    if(!el) return;
    var D = buildDaily(), n = D.dates.length;
    if(!n){ el.innerHTML = ''; return; }

    var pick = function(i){
      if(hmMetric === 'me') return D.me[i];
      if(hmMetric === 'peer') return D.peer[i];
      return D.me[i] + D.peer[i];
    };
    var vals = [], max = 0;
    for(var i = 0; i < n; i++){ var v = pick(i); vals.push(v); if(v > max) max = v; }

    // 色阶阈值：按当日峰值分 4 档（0 单独一档）——阈值跟着数据走，换数据集不用改代码
    var thr = [1, 2, 3, 4];
    if(max > 0){
      thr = [Math.max(1, Math.round(max * 0.08)), Math.max(2, Math.round(max * 0.22)),
             Math.max(3, Math.round(max * 0.45)), Math.max(4, Math.round(max * 0.75))];
    }
    var level = function(x){
      if(!x) return 0;
      if(x >= thr[3]) return 4;
      if(x >= thr[2]) return 3;
      if(x >= thr[1]) return 2;
      return 1;
    };

    // 以第一条所在周的周一为第 0 列（dates 是逻辑日 key，取正午求星期）
    var first = dayNoon(D.dates[0]);
    var off = (first.getDay() + 6) % 7;                   // 周一 = 0
    var COL = [], ROW = [];
    for(var i2 = 0; i2 < n; i2++){
      var dt = dayNoon(D.dates[i2]);
      ROW.push((dt.getDay() + 6) % 7);
      COL.push(Math.floor((i2 + off) / 7));
    }
    var weeks = COL[n - 1] + 1;
    var CS = 11, GAP = 3, padL = 26, padT = 17;
    var W = padL + weeks * (CS + GAP) + 4;
    var H = padT + 7 * (CS + GAP) + 3;

    var g = '';
    // 月份标签：整列的第一条真实日期跨月了就标一次
    var lastMon = '';
    for(var c = 0; c < weeks; c++){
      var cand = '';
      for(var i3 = 0; i3 < n; i3++){ if(COL[i3] === c){ cand = D.dates[i3]; break; } }
      if(!cand) continue;
      var mon = cand.slice(0, 7);
      if(mon !== lastMon){
        lastMon = mon;
        g += '<text x="' + (padL + c * (CS + GAP)) + '" y="11" style="font-size:9.5px;fill:var(--muted)">' +
             esc(mon.slice(2)) + '</text>';
      }
    }
    // 星期标签（只标周一 / 三 / 五，和 GitHub 一样）
    ['一', '三', '五'].forEach(function(txt, k){
      var row = k * 2;
      g += '<text x="' + (padL - 6) + '" y="' + (padT + row * (CS + GAP) + CS - 2) +
           '" text-anchor="end" style="font-size:9px;fill:var(--muted)">' + txt + '</text>';
    });
    // 方格。注意：SVG 的 presentation attribute 不解析 CSS 变量，颜色一律走 style=""
    for(var i4 = 0; i4 < n; i4++){
      var v2 = vals[i4], lv = level(v2);
      var x = padL + COL[i4] * (CS + GAP), y = padT + ROW[i4] * (CS + GAP);
      var tip = D.dates[i4] + '　我 ' + D.me[i4] + ' 条 · TA ' + D.peer[i4] + ' 条' +
                (v2 ? '' : '（这天没有消息）');
      g += '<rect class="c" x="' + x + '" y="' + y + '" width="' + CS + '" height="' + CS +
           '" rx="2.5" data-day="' + esc(D.dates[i4]) + '" style="fill:var(--hm' + lv + ')">' +
           '<title>' + esc(tip) + '</title></rect>';
    }
    el.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    el.setAttribute('width', W);
    el.setAttribute('height', H);
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', '日历热力图：' + D.dates[0] + ' 至 ' + D.dates[n - 1] + '，共 ' + n + ' 天');
    el.innerHTML = g;

    var leg = document.getElementById('hmLeg');
    if(leg){
      leg.innerHTML = '<span>少</span>' +
        [0, 1, 2, 3, 4].map(function(k){ return '<i style="background:var(--hm' + k + ')"></i>'; }).join('') +
        '<span>多</span><span class="sp"></span>' +
        '<span>共 ' + n.toLocaleString() + ' 天 · 单日峰值 ' + max.toLocaleString() + ' 条</span>';
    }
  }

  (function bindHeat(){
    var el = document.getElementById('heat');
    if(el){
      el.onclick = function(e){
        var t = e.target;
        var day = t && t.getAttribute ? t.getAttribute('data-day') : null;
        if(day) jumpToDate(day);
      };
    }
    var seg = document.getElementById('hmSeg');
    if(seg){
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){
        b.onclick = function(){
          Array.prototype.forEach.call(seg.querySelectorAll('button'), function(x){
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
          hmMetric = b.dataset.hm || 'all';
          renderHeat();
        };
      });
    }
  })();

  /* ==========================================================
     聊天节律（P2-11）
     ----------------------------------------------------------
     口径与统计面板一致（排除自动回复 / 系统通知 / 非双方消息），全部现算：
       · 谁先开口：按时间排序后，间隔超过 30 分钟就算「新一轮」，
         该轮第一条是谁发的就记谁先开口。
       · 回复时延：相邻两条若是「一方 → 另一方」就记一次等待；
         超过 12 小时的不计入（那是隔天了，会把中位数拉得没有意义）。
       · 24 小时 / 星期分布：按**本机时区**取，双方分开统计。
         ⚠ 两处口径不同源：**小时**用真实钟点（03:00 就是 03:00），
         **星期**用「每天 05:00 分界」后的逻辑日 —— 后者必须与分隔条一致，
         否则周三 02:00 的消息会被算成周三、却挂在「周二」那条分隔条下面。同上，
         回复时延只用来判断「隔不隔天」的 12 小时阈值不受影响（那是纯时间差）。
     ========================================================== */
  var RHY = null;
  var GAP_NEW = 30 * 60 * 1000;
  var GAP_MAX = 12 * 60 * 60 * 1000;
  var WEEK_CN = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

  function buildRhythm(){
    if(RHY) return RHY;
    var base = [];
    ALL.forEach(function(m){
      if(!m.ts) return;
      if(msgKind(m) !== 'count') return;
      if(m.from !== 'me' && m.from !== 'peer') return;
      base.push(m);
    });
    base.sort(function(a, b){ return a.ts - b.ts; });

    var openMe = 0, openPeer = 0;
    var lat = { m2p: [], p2m: [] };
    var hourMe = new Array(24).fill(0), hourPeer = new Array(24).fill(0);
    var dowMe = new Array(7).fill(0), dowPeer = new Array(7).fill(0);

    for(var i = 0; i < base.length; i++){
      var m = base[i], d = new Date(m.ts);
      /* 小时用**真实钟点**（d.getHours()），星期用**逻辑日**的星期：
         00:00~05:00 那种消息，钟点是它自己的，但「算哪一天」必须和分隔条一致，
         否则同一个面板里两处口径打架（周三 02:00 会被算成周三，可它挂在周二下面）。 */
      var h = d.getHours(), w = (dayDate(m.ts).getDay() + 6) % 7;
      if(m.from === 'me'){ hourMe[h]++; dowMe[w]++; } else { hourPeer[h]++; dowPeer[w]++; }

      if(i === 0 || (m.ts - base[i - 1].ts) > GAP_NEW){
        if(m.from === 'me') openMe++; else openPeer++;
      }
      if(i > 0 && base[i - 1].from !== m.from){
        var dt = m.ts - base[i - 1].ts;
        if(dt > 0 && dt <= GAP_MAX){
          if(m.from === 'me') lat.m2p.push(dt); else lat.p2m.push(dt);
        }
      }
    }

    var median = function(a){
      if(!a.length) return null;
      var s = a.slice().sort(function(x, y){ return x - y; });
      var k = Math.floor(s.length / 2);
      return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2;
    };
    var mean = function(a){
      return a.length ? a.reduce(function(x, y){ return x + y; }, 0) / a.length : null;
    };

    RHY = {
      n: base.length,
      openMe: openMe, openPeer: openPeer,
      m2p: { n: lat.m2p.length, med: median(lat.m2p), avg: mean(lat.m2p) },
      p2m: { n: lat.p2m.length, med: median(lat.p2m), avg: mean(lat.p2m) },
      hourMe: hourMe, hourPeer: hourPeer, dowMe: dowMe, dowPeer: dowPeer,
    };
    return RHY;
  }

  function fmtDur(ms){
    if(ms == null) return '—';
    var s = ms / 1000;
    if(s < 60) return Math.round(s) + ' 秒';
    var min = s / 60;
    if(min < 60) return (min < 10 ? min.toFixed(1) : Math.round(min)) + ' 分钟';
    var h = min / 60;
    if(h < 24) return (h < 10 ? h.toFixed(1) : Math.round(h)) + ' 小时';
    return (h / 24).toFixed(1) + ' 天';
  }

  function renderRhythm(){
    var el = document.getElementById('rhythm');
    if(!el) return;
    var R = buildRhythm();
    if(!R.n){
      el.innerHTML = '<div class="rhbox"><div class="sub">没有可用于统计的消息</div></div>';
      return;
    }

    var pct = function(a, b){ return b ? Math.round(a / b * 100) : 0; };
    function grouped(a1, a2, labels){
      var mx = 1;
      a1.forEach(function(v){ if(v > mx) mx = v; });
      a2.forEach(function(v){ if(v > mx) mx = v; });
      var bars = '';
      for(var i = 0; i < a1.length; i++){
        bars += '<span style="height:' + (a1[i] ? Math.max(2, Math.round(a1[i] / mx * 100)) : 0) + '%"></span>';
        bars += '<span class="p" style="height:' + (a2[i] ? Math.max(2, Math.round(a2[i] / mx * 100)) : 0) + '%"></span>';
      }
      return { bars: bars, axis: labels.map(function(s){ return '<span>' + s + '</span>'; }).join('') };
    }

    var hourLabels = [];
    for(var i = 0; i < 24; i++) hourLabels.push(i % 6 === 0 ? String(i) : '');
    var h24 = grouped(R.hourMe, R.hourPeer, hourLabels);
    var d7 = grouped(R.dowMe, R.dowPeer, WEEK_CN.map(function(s){ return s.slice(1); }));

    var peakH = 0, peakV = -1;
    for(var k = 0; k < 24; k++){ var v = R.hourMe[k] + R.hourPeer[k]; if(v > peakV){ peakV = v; peakH = k; } }
    var peakD = 0, peakDV = -1;
    for(var k2 = 0; k2 < 7; k2++){ var v2 = R.dowMe[k2] + R.dowPeer[k2]; if(v2 > peakDV){ peakDV = v2; peakD = k2; } }

    var openTot = R.openMe + R.openPeer;
    var lg = '<div class="rhlg"><span><i style="background:var(--c-me)"></i>我发出</span>' +
             '<span><i style="background:var(--c-peer)"></i>TA 回复</span></div>';

    el.innerHTML =
      '<div class="rhbox">' +
        '<h4>谁先开口</h4>' +
        '<div class="big">' + pct(R.openMe, openTot) + '<i>% 是我先说话</i></div>' +
        '<div class="sub">把对话按「间隔超过 30 分钟」切成 <b>' + openTot.toLocaleString() + '</b> 轮：' +
          '我开了 <b>' + R.openMe.toLocaleString() + '</b> 轮，TA 开了 <b>' + R.openPeer.toLocaleString() + '</b> 轮</div>' +
      '</div>' +
      '<div class="rhbox">' +
        '<h4>回复时延</h4>' +
        '<div class="big">' + fmtDur(R.p2m.med) + '<i>中位数 · TA 回我</i></div>' +
        '<div class="sub">平均 ' + fmtDur(R.p2m.avg) + '，样本 ' + R.p2m.n.toLocaleString() + ' 次<br>' +
          '我回 TA：中位 ' + fmtDur(R.m2p.med) + '，平均 ' + fmtDur(R.m2p.avg) +
          '，样本 ' + R.m2p.n.toLocaleString() + ' 次<br>' +
          '超过 12 小时的等待不计入（那多半是隔天了）</div>' +
      '</div>' +
      '<div class="rhbox">' +
        '<h4>一天里什么时候最活跃</h4>' +
        '<div class="big">' + peakH + ':00<i>~ ' + (peakH + 1) + ':00 · 合计 ' +
          (peakV < 0 ? 0 : peakV).toLocaleString() + ' 条</i></div>' +
        '<div class="rhbars">' + h24.bars + '</div>' +
        '<div class="rhaxis">' + h24.axis + '</div>' + lg +
      '</div>' +
      '<div class="rhbox">' +
        '<h4>一周里哪天最活跃</h4>' +
        '<div class="big">' + WEEK_CN[peakD] + '<i>合计 ' + (peakDV < 0 ? 0 : peakDV).toLocaleString() + ' 条</i></div>' +
        '<div class="rhbars">' + d7.bars + '</div>' +
        '<div class="rhaxis">' + d7.axis + '</div>' + lg +
      '</div>';
  }

  /* ==========================================================
     高频词云（P2-12）
     ----------------------------------------------------------
     中文没有空格，这里用「2 字 + 3 字滑窗」统计，再把被更长词覆盖掉的
     子串删掉（例：「角色名+直」的出现次数和「角色名」差不多 → 只留更长的那个），
     英文 / 数字按整词统计。不引入任何分词库，纯本地。
     ========================================================== */
  var WC = { ocr: false, stop: true, only: '' };
  var WCD = null;

  var STOP_WORDS = (function(){
    var raw = '的 了 是 在 我 你 他 她 它 们 这 那 有 和 与 就 都 也 还 但 而 及 或 把 被 给 让 对 从 到 上 下 里 外 中 前 后 个 只 件 些 什么 怎么 为什么 因为 所以 但是 如果 可以 可能 应该 觉得 感觉 知道 现在 今天 明天 昨天 时候 一下 一个 这个 那个 哪个 我们 你们 他们 自己 就是 不是 没有 真的 好的 可以 这样 那样 是不是 有没有 起来 出来 过来 的话 一样 不是 不错 有点 一点 很多 这么 那么 然后 而且 或者 不过 其实 只是 还是 已经 一直 一定 一次 一天 大家 时候 什么 干什';
    var s = {};
    raw.split(/\s+/).forEach(function(w){ if(w) s[w] = 1; });
    [PEER_LABEL, SELF_LABEL, '分享图片', '分享视频', '分享语音', '自定义表情',
     '你撤回了一条消息', '对方撤回了一条消息'].forEach(function(w){ s[w] = 1; });
    return s;
  })();

  function wcTokens(text){
    var t = String(text || '')
      .replace(/https?:\/\/\S+/g, ' ')          // 链接不参与词频
      .replace(/\[[^\[\]\s]{1,24}\]/g, ' ')     // 表情记号 [tv_doge]
      .replace(/&[a-z]+;/gi, ' ');
    var out = [], m;
    var reCJK = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]+/g;
    while((m = reCJK.exec(t))){
      var s = m[0];
      for(var n = 2; n <= 3; n++){
        for(var i = 0; i + n <= s.length; i++) out.push(s.substr(i, n));
      }
    }
    var reWord = /[A-Za-z][A-Za-z0-9_'\-]{1,23}|\d{2,8}/g;
    while((m = reWord.exec(t))) out.push(m[0].toLowerCase());
    return out;
  }

  function buildWords(){
    if(WCD) return WCD;
    var all = {}, me = {}, peer = {}, total = 0;
    var bump = function(map, k){ map[k] = (map[k] || 0) + 1; };

    ALL.forEach(function(m){
      if(msgKind(m) !== 'count') return;
      if(m.from !== 'me' && m.from !== 'peer') return;
      if(WC.only && m.from !== WC.only) return;
      var text = m.text || '';
      if(WC.ocr && m._ocr) text += ' ' + m._ocr;
      if(!text) return;
      total++;
      var toks = wcTokens(text), seen = {};
      for(var i = 0; i < toks.length; i++){
        var w = toks[i];
        if(WC.stop && STOP_WORDS[w]) continue;
        bump(all, w);
        if(!seen[w]){ seen[w] = 1; if(m.from === 'me') bump(me, w); else bump(peer, w); }
      }
    });

    // 先按词频取候选池，再在池内做子串抑制
    // （全量两两比对是 O(n²)，实测候选词可达十万级，会卡死页面）
    var ranked = Object.keys(all).sort(function(a, b){ return all[b] - all[a]; });
    var pool = ranked.slice(0, 600);
    var kill = {};
    pool.forEach(function(L){
      if(L.length !== 3) return;
      [L.slice(0, 2), L.slice(1, 3)].forEach(function(w){
        if(all[w] && all[L] >= all[w] * 0.6) kill[w] = 1;
      });
    });

    var list = pool.filter(function(w){ return !kill[w] && all[w] >= 2; })
      .slice(0, 80)
      .map(function(w){ return { w: w, n: all[w], me: me[w] || 0, peer: peer[w] || 0 }; });

    WCD = { list: list, total: total, kinds: ranked.length };
    return WCD;
  }

  function renderWords(){
    var el = document.getElementById('wc'), meta = document.getElementById('wcMeta');
    if(!el) return;
    var D = buildWords();
    if(!D.list.length){
      el.innerHTML = '<span style="color:var(--muted);font-size:12px">没有统计到高频词</span>';
      if(meta) meta.textContent = '';
      return;
    }
    var maxN = D.list[0].n, minN = D.list[D.list.length - 1].n;
    var spanN = Math.max(1, maxN - minN);
    el.innerHTML = D.list.map(function(o){
      var t = (o.n - minN) / spanN;
      var fs = 12 + Math.round(t * 24);
      var who = (o.me === o.peer) ? 'both' : (o.me > o.peer ? 'me' : 'peer');
      var col = who === 'me' ? 'var(--c-me)' : (who === 'peer' ? 'var(--c-peer)' : 'var(--text)');
      var op = (0.6 + t * 0.4).toFixed(2);
      var tip = o.w + '：共 ' + o.n + ' 次（我 ' + o.me + ' · TA ' + o.peer + '）';
      return '<b title="' + esc(tip) + '" style="font-size:' + fs + 'px;color:' + col + ';opacity:' + op + '">' +
             esc(o.w) + '<small>' + o.n + '</small></b>';
    }).join('');

    if(meta){
      meta.innerHTML = '统计范围：' + D.total.toLocaleString() + ' 条真实发言 · ' +
        D.kinds.toLocaleString() + ' 个候选词' +
        (WC.only ? '　·　只看' + (WC.only === 'me' ? '我发的' : 'TA 发的') : '') +
        (WC.ocr ? '　·　已含图内文字' : '') +
        (WC.stop ? '　·　已过滤虚词' : '') +
        '　·　中文按 2~3 字滑窗统计（没引分词库，纯本地）';
    }
  }

  function refreshWords(){ WCD = null; renderWords(); }

  (function bindWordControls(){
    [['wcOcr', 'ocr'], ['wcStop', 'stop']].forEach(function(pair){
      var el = document.getElementById(pair[0]);
      if(!el) return;
      el.onclick = function(){
        WC[pair[1]] = !WC[pair[1]];
        el.setAttribute('aria-pressed', WC[pair[1]] ? 'true' : 'false');
        refreshWords();
      };
    });
    [['wcMine', 'me'], ['wcPeer', 'peer']].forEach(function(pair){
      var el = document.getElementById(pair[0]);
      if(!el) return;
      el.onclick = function(){
        WC.only = (WC.only === pair[1]) ? '' : pair[1];
        document.getElementById('wcMine').setAttribute('aria-pressed', WC.only === 'me' ? 'true' : 'false');
        document.getElementById('wcPeer').setAttribute('aria-pressed', WC.only === 'peer' ? 'true' : 'false');
        refreshWords();
      };
    });
  })();

  /* ==========================================================
     导出（P1-7）· 敏感信息打码（P2-14）
     ----------------------------------------------------------
     ⚠ 全部在**浏览器里本地生成文件并下载**：
       不上传任何内容、不联网、不依赖任何云服务。
     说明：
       · HTML 导出里的图片用**相对路径**引用。file:// 下浏览器禁止 JS
         读取本地图片做内联（会被 CORS 拦），所以请把导出的 HTML
         保存到本项目目录下再打开，图片就能正常显示。
       · 打码是「尽力而为」：规则命中数会在导出后如实报给你，
         地址这类非结构化内容只能做启发式识别。
       · 加密用 WebCrypto 的 AES-GCM 256 + PBKDF2(SHA-256, 20 万次迭代)。
         加密包只能由**本页面**导入解密。
     ========================================================== */
  /* 纯数字的三条规则必须带「数字边界」(?<!\d) / (?!\d)，否则会互相踩
     （2026-09-16 实测）：
       · /\d{17}[\dXx]/ 会从 19 位银行卡里咬走前 18 位 → 卡号被标成「身份证」，尾数裸奔
       · /1[3-9]\d{9}/  会从 18 位身份证中间咬走 11 位 → 身份证被标成「手机号」
     加上边界后，每条规则只认「独立成串」的那一段：
       19 位数字 → 银行卡 · 18 位(<数字>|X) → 身份证 · 11 位 1[3-9] 开头 → 手机号。
     scripts/msg_kind.mjs 里有一份逐条对应的，改这里必须同步改那边。 */
  var MASK_RULES = [
    { k: '手机号',   re: /(?<!\d)1[3-9]\d{9}(?!\d)/g, to: '[手机号已打码]' },
    { k: '邮箱',     re: /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g, to: '[邮箱已打码]' },
    { k: '身份证',   re: /(?<!\d)\d{17}[\dXx](?!\d)/g, to: '[身份证已打码]' },
    // 银行卡取「16 位以上」：位数上限卡死会让 20 位以上的长数字串一条规则都不命中
    // （边界要求独立成串，超长串切不出 16~19 位）→ 反而漏掉不打码。
    { k: '银行卡',   re: /(?<!\d)\d{16,}(?!\d)/g, to: '[银行卡已打码]' },
    { k: '账号',     re: /(?:QQ|qq|微信|vx|VX|Vx|v信|wechat|WeChat)\s*[:：]?\s*[A-Za-z0-9_\-]{5,20}/g, to: '[账号已打码]' },
    { k: '收货地址', re: /[\u4e00-\u9fa5]{2,8}(?:省|市)[\u4e00-\u9fa5]{1,8}(?:区|县|市)[\u4e00-\u9fa5]{1,12}(?:路|街|道|巷|小区|大厦|楼)[0-9A-Za-z\-]{0,10}号?/g, to: '[地址已打码]' },
  ];
  var maskHits = {};

  function maskText(s){
    var out = String(s == null ? '' : s);
    MASK_RULES.forEach(function(r){
      out = out.replace(r.re, function(){ maskHits[r.k] = (maskHits[r.k] || 0) + 1; return r.to; });
    });
    return out;
  }

  function expScopeRows(){
    var sc = document.getElementById('expScope');
    return (sc && sc.value === 'all') ? ALL : st.list;
  }

  function updateExpCnt(){
    var el = document.getElementById('expCnt');
    if(!el) return;
    var n = expScopeRows().length;
    el.hidden = false;
    el.textContent = n.toLocaleString();
  }

  function expWho(m){
    if(m.from === 'me') return '我';
    return META.peer_name || 'TA';
  }

  /* 把一条消息压成一行可读文字（含卡片、链接、撤回标记、图片索引） */
  function expLine(m, opts){
    var o = opts || {};
    var T = o.T || function(x){ return String(x == null ? '' : x); };
    var t = m.text || '';
    if(m.card){
      var ct = [];
      if(m.card.author) ct.push('@' + m.card.author);
      if(m.card.title) ct.push(m.card.title);
      if(m.card.text && String(m.card.text).trim() !== String(m.card.title || '').trim()) ct.push(m.card.text);
      if(ct.length) t = (t ? t + ' ' : '') + '[' + (m.card.sub || '卡片') + '] ' + ct.join(' · ');
    }
    (m.links || []).forEach(function(l){
      var u = l.long || l.short || '';
      if(u && t.indexOf(u) < 0 && (!l.short || t.indexOf(l.short) < 0)) t += ' ' + u;
    });
    if(m.recalled) t = '（已撤回）' + (t || '');
    t = T(t).trim();
    if(o.notes === false) return t;
    var notes = [];
    (m.images || []).forEach(function(im){
      if(im._ocrt) notes.push('［图内文字］' + T(im._ocrt));
      if(im._vlmt) notes.push('［图片描述］' + T(im._vlmt));
    });
    return notes.length ? (t ? t + '\n' : '') + notes.join('\n') : t;
  }

  function expImageList(m){
    return (m.images || []).map(function(im){ return im.local || im.url || ''; }).filter(Boolean);
  }

  function expMetaHeader(){
    var rows = expScopeRows();
    var t0 = rows.length ? rows[0].ts : 0, t1 = rows.length ? rows[rows.length - 1].ts : 0;
    return {
      source: SRC.key, label: SRC.label,
      peer_name: META.peer_name || '', self_name: META.self_name || '',
      count: rows.length,
      first: t0 ? fmtD(t0) : '', last: t1 ? fmtD(t1) : '',
      exported_at: new Date().toISOString(),
    };
  }

  function buildTxt(rows, o){
    var H = expMetaHeader();
    var out = [];
    out.push('# ' + SRC.title + ' · 导出');
    out.push('# 来源：' + H.label + '（' + H.source + '）');
    out.push('# 范围：' + H.first + ' ~ ' + H.last + '，共 ' + H.count.toLocaleString() + ' 条');
    out.push('# 导出时间：' + H.exported_at + '　敏感信息打码：' + (o.masked ? '是' : '否'));
    out.push('# 本地离线生成，未上传任何内容');
    out.push('');
    rows.forEach(function(m){
      var ts = m.ts ? fmt(m.ts) : '时间未知';
      out.push('[' + ts + '] ' + expWho(m) + ': ' + expLine(m, o).replace(/\n/g, '\n    '));
      expImageList(m).forEach(function(p){ out.push('    <图片> ' + p); });
    });
    return out.join('\n') + '\n';
  }

  function buildMd(rows, o){
    var H = expMetaHeader();
    var out = ['# ' + SRC.title + ' · 导出', '',
      '- 来源：' + H.label + '（`' + H.source + '`）',
      '- 范围：' + H.first + ' ~ ' + H.last + '，共 **' + H.count.toLocaleString() + '** 条',
      '- 导出时间：' + H.exported_at,
      '- 敏感信息打码：' + (o.masked ? '是' : '否'),
      '- 由本地离线查看页生成，未上传任何内容', '', '---', ''];
    rows.forEach(function(m){
      out.push('**' + (m.ts ? fmt(m.ts) : '时间未知') + ' · ' + expWho(m) + '**', '');
      var body = expLine(m, o);
      if(body) out.push(body.replace(/^/gm, ''), '');
      expImageList(m).forEach(function(p){ out.push('![](' + p + ')', ''); });
    });
    return out.join('\n');
  }

  function buildHtml(rows, o){
    var H = expMetaHeader();
    var parts = [];
    parts.push('<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">');
    parts.push('<meta name="viewport" content="width=device-width,initial-scale=1">');
    parts.push('<title>' + esc(SRC.title) + ' · 导出</title>\n<style>');
    parts.push('body{margin:0;background:#f4f6f9;color:#1f2329;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}');
    parts.push('.wrap{max-width:900px;margin:0 auto;padding:26px 18px 60px}');
    parts.push('h1{font-size:19px;margin:0 0 6px}');
    parts.push('.hd{background:#fff;border:1px solid #e6e9ee;border-radius:12px;padding:12px 15px;font-size:12.5px;color:#5b6472;line-height:1.85;margin-bottom:16px}');
    parts.push('.m{margin:0 0 13px;display:flex;flex-direction:column;gap:3px}');
    parts.push('.m .who{font-size:11.5px;color:#8b939c}');
    parts.push('.m .b{max-width:78%;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid #e6e9ee;white-space:pre-wrap;word-break:break-word}');
    parts.push('.m.me{align-items:flex-end}.m.me .b{background:linear-gradient(135deg,#4f7cff,#7b5cff);color:#fff;border-color:transparent}');
    parts.push('.m img{max-width:min(78%,420px);border-radius:10px;border:1px solid #e6e9ee;display:block;margin-top:4px}');
    parts.push('.note{font-size:11.5px;color:#8b939c;margin-top:3px;white-space:pre-wrap}');
    parts.push('</style>\n</head>\n<body>\n<div class="wrap">');
    parts.push('<h1>' + esc(SRC.title) + ' · 导出</h1>');
    parts.push('<div class="hd">来源：' + esc(H.label) + '（' + esc(H.source) + '）<br>范围：' +
      esc(H.first) + ' ~ ' + esc(H.last) + '，共 ' + H.count.toLocaleString() + ' 条<br>导出时间：' +
      esc(H.exported_at) + '　敏感信息打码：' + (o.masked ? '是' : '否') +
      '<br>⚠ 图片用相对路径引用，请把本文件保存到项目目录下再打开，否则图片不显示。</div>');

    rows.forEach(function(m){
      var isMe = m.from === 'me';
      var body = expLine(m, o);
      var notes = expLine(m, { T: o.T, withNotes: true });
      notes = notes && body && notes.indexOf(body) === 0 ? notes.slice(body.length).trim() : (body ? '' : notes);
      parts.push('<div class="m' + (isMe ? ' me' : '') + '">');
      parts.push('<div class="who">' + (m.ts ? esc(fmt(m.ts)) : '时间未知') + ' · ' + esc(expWho(m)) + '</div>');
      if(body) parts.push('<div class="b">' + esc(body) + '</div>');
      if(notes) parts.push('<div class="note">' + esc(notes) + '</div>');
      expImageList(m).forEach(function(p){
        parts.push('<img src="' + esc(p) + '" alt="图片" loading="lazy">');
      });
      parts.push('</div>');
    });
    parts.push('</div>\n</body>\n</html>');
    return parts.join('\n');
  }

  function buildJson(rows, o){
    var clean = rows.map(function(m){
      var x = {
        id: m.id, ts: m.ts, time: m.time, day: m.ts ? dayKey(m.ts) : '',
        from: m.from, sender: o.T(m.sender), type: m.type, media_type: m.media_type,
        recalled: !!m.recalled, text: o.T(m.text || ''),
      };
      if(m.msg_source !== undefined) x.msg_source = m.msg_source;
      if(m.seqno !== undefined) x.seqno = m.seqno;
      if(m.card) x.card = {
        kind: m.card.kind, sub: m.card.sub || '', author: o.T(m.card.author || ''),
        title: o.T(m.card.title || ''), text: o.T(m.card.text || ''),
        url: m.card.url || '', bvid: m.card.bvid || '',
      };
      if((m.links || []).length) x.links = m.links.map(function(l){
        return { short: l.short || '', long: l.long || '', title: o.T(l.title || '') };
      });
      if((m.images || []).length) x.images = m.images.map(function(im){
        return {
          kind: im.kind, local: im.local || '', url: im.url || '',
          ocr_text: o.T(im._ocrt || ''), vlm_text: o.T(im._vlmt || ''),
        };
      });
      return x;
    });
    return JSON.stringify({ _meta: expMetaHeader(), messages: clean }, null, 2) + '\n';
  }

  function buildJsonl(rows, o){
    return rows.map(function(m){
      return JSON.stringify({
        id: m.id, ts: m.ts, iso: m.time, day: m.ts ? dayKey(m.ts) : '',
        from: m.from, who: expWho(m), sender: o.T(m.sender),
        type: m.type, media_type: m.media_type, recalled: !!m.recalled,
        text: o.T(m.text || ''),
        ocr_text: (m.images || []).map(function(im){ return o.T(im._ocrt || ''); }).filter(Boolean),
        vlm_text: (m.images || []).map(function(im){ return o.T(im._vlmt || ''); }).filter(Boolean),
        card: m.card ? { sub: m.card.sub || '', author: o.T(m.card.author || ''),
                         title: o.T(m.card.title || ''), text: o.T(m.card.text || ''),
                         url: m.card.url || '' } : null,
        images: expImageList(m),
      });
    }).join('\n') + '\n';
  }

  function csvCell(v){
    var s = String(v == null ? '' : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function buildCsv(rows, o){
    var out = ['时间,谁,类型,含图片,图片数,撤回,正文'];
    rows.forEach(function(m){
      out.push([
        m.ts ? fmt(m.ts) : '', expWho(m), m.type || '',
        (m.images || []).length ? '是' : '否', (m.images || []).length,
        m.recalled ? '是' : '否',
        expLine(m, o).replace(/\n/g, ' ⏎ '),
      ].map(csvCell).join(','));
    });
    return '\ufeff' + out.join('\r\n') + '\r\n';   // 带 BOM，Excel 打开不乱码
  }

  function saveBlob(name, text, mime){
    var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 5000);
  }

  function expStamp(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return String(d.getFullYear()) + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  function expMsg(html, cls){
    var el = document.getElementById('expMsg');
    if(!el) return;
    el.hidden = false;
    el.className = 'expmsg' + (cls ? ' ' + cls : '');
    el.innerHTML = html;
  }

  /* 生成指定格式的导出文本；返回 {text, name, mime} */
  function makeExport(fmt){
    var rows = expScopeRows();
    var masked = document.getElementById('expMask').getAttribute('aria-pressed') === 'true';
    maskHits = {};
    var opt = { masked: masked, T: masked ? maskText : function(x){ return String(x == null ? '' : x); } };
    var stamp = expStamp(), base = SRC.key + '-私信导出-' + stamp;
    var r;
    if(fmt === 'html')   r = { text: buildHtml(rows, opt), name: base + '.html', mime: 'text/html' };
    else if(fmt === 'md') {
      r = { text: buildMd(rows, opt), name: base + '.md', mime: 'text/markdown' };
      opt.withNotes = true;
    }
    else if(fmt === 'txt') r = { text: buildTxt(rows, opt), name: base + '.txt', mime: 'text/plain' };
    else if(fmt === 'json') r = { text: buildJson(rows, opt), name: base + '.json', mime: 'application/json' };
    else if(fmt === 'jsonl') r = { text: buildJsonl(rows, opt), name: base + '.jsonl', mime: 'application/x-ndjson' };
    else if(fmt === 'csv') r = { text: buildCsv(rows, opt), name: base + '.csv', mime: 'text/csv' };
    else throw new Error('未知导出格式：' + fmt);
    r.rows = rows.length;
    r.masked = masked;
    return r;
  }

  function maskSummary(){
    var ks = Object.keys(maskHits);
    if(!ks.length) return '未命中任何敏感信息规则';
    return '打码命中：' + ks.map(function(k){ return k + ' ' + maskHits[k]; }).join(' · ');
  }

  /* ---------- 加密（WebCrypto：PBKDF2-SHA256 20 万次 → AES-GCM 256）---------- */
  function b64(buf){
    var b = new Uint8Array(buf), s = '';
    for(var i = 0; i < b.length; i += 0x8000){
      s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    }
    return btoa(s);
  }
  function unb64(str){
    var s = atob(String(str || '')), b = new Uint8Array(s.length);
    for(var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  function subtleOK(){
    return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.importKey && window.TextEncoder);
  }
  function deriveKey(pwd, salt, iter){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(String(pwd)), { name: 'PBKDF2' }, false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }
  function encryptText(pwd, plain, name){
    var iter = 200000;
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pwd, salt, iter).then(function(key){
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key,
                                   new TextEncoder().encode(plain));
    }).then(function(ct){
      return JSON.stringify({
        _fmt: 'dm-backup-encrypted', v: 1,
        kdf: 'PBKDF2-SHA256', iter: iter, cipher: 'AES-GCM-256',
        salt: b64(salt), iv: b64(iv), ct: b64(ct),
        name: name || '', created_at: new Date().toISOString(),
      }, null, 2);
    });
  }
  function decryptText(pwd, envelope){
    var o;
    try{ o = JSON.parse(envelope); }
    catch(e){ return Promise.reject(new Error('文件不是合法的加密包（JSON 解析失败）')); }
    if(!o || o._fmt !== 'dm-backup-encrypted'){
      return Promise.reject(new Error('不是本工具生成的加密包（缺少 _fmt 标记）'));
    }
    var salt = unb64(o.salt), iv = unb64(o.iv), ct = unb64(o.ct);
    return deriveKey(pwd, salt, o.iter || 200000).then(function(key){
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    }).then(function(pt){
      return { text: new TextDecoder().decode(pt), name: o.name || '解密结果.json' };
    }, function(){
      throw new Error('口令不对，或文件已损坏');
    });
  }

  /* ---------- 导出相关的交互 ---------- */
  (function bindExport(){
    var scope = document.getElementById('expScope');
    if(scope) scope.onchange = updateExpCnt;

    var mask = document.getElementById('expMask');
    if(mask){
      mask.onclick = function(){
        var on = mask.getAttribute('aria-pressed') !== 'true';
        mask.setAttribute('aria-pressed', on ? 'true' : 'false');
      };
    }

    Array.prototype.forEach.call(document.querySelectorAll('.expgrid button[data-exp]'), function(b){
      b.onclick = function(){
        var fmt = b.dataset.exp;
        try{
          var r = makeExport(fmt);
          if(!r.rows){ expMsg('当前范围里没有消息，没东西可导。', 'bad'); return; }
          saveBlob(r.name, r.text, r.mime);
          expMsg('已导出 <b>' + esc(r.name) + '</b>（' + r.rows.toLocaleString() + ' 条 · ' +
                 (r.text.length / 1024).toFixed(0) + ' KB）<br>' +
                 (r.masked ? maskSummary() + '<br>' : '') +
                 (fmt === 'html' ? '请把文件保存到项目目录下再打开，图片才显示。' : ''), 'ok');
        }catch(e){
          expMsg('导出失败：' + esc(e && e.message ? e.message : e), 'bad');
        }
      };
    });

    var enc = document.getElementById('expEnc');
    if(enc) enc.onclick = function(){
      var pwd = (document.getElementById('expPwd').value || '').trim();
      if(pwd.length < 4){ expMsg('口令至少 4 位。', 'bad'); return; }
      if(!subtleOK()){ expMsg('当前环境不支持 WebCrypto，无法加密导出。', 'bad'); return; }
      try{
        var r = makeExport('json');
        if(!r.rows){ expMsg('当前范围里没有消息。', 'bad'); return; }
        enc.disabled = true;
        encryptText(pwd, r.text, r.name).then(function(env2){
          saveBlob(r.name.replace(/\.json$/, '') + '.enc.json', env2, 'application/json');
          expMsg('已加密导出 <b>' + esc(r.name.replace(/\.json$/, '.enc.json')) + '</b>' +
                 '（' + r.rows.toLocaleString() + ' 条 · AES-GCM 256）<br>' +
                 '这个文件只能在本页面用「导入解密」还原，别忘了口令。', 'ok');
        }).catch(function(e){
          expMsg('加密失败：' + esc(e && e.message ? e.message : e), 'bad');
        }).then(function(){ enc.disabled = false; });
      }catch(e){
        expMsg('加密失败：' + esc(e && e.message ? e.message : e), 'bad');
      }
    };

    var impBtn = document.getElementById('expImpBtn'), imp = document.getElementById('expImp');
    if(impBtn && imp) impBtn.onclick = function(){ imp.click(); };
    if(imp) imp.onchange = function(){
      var f = imp.files && imp.files[0];
      if(!f) return;
      f.text().then(function(env2){
        if(!subtleOK()) throw new Error('当前环境不支持 WebCrypto，无法解密');
        var pwd = (document.getElementById('expPwd').value || '').trim();
        if(!pwd) pwd = window.prompt('输入这个加密包的口令：') || '';
        if(!pwd) throw new Error('没有输入口令');
        return decryptText(pwd, env2).then(function(res){
          saveBlob(res.name || '解密结果.json', res.text, 'application/json');
          expMsg('已解密并导出 <b>' + esc(res.name || '解密结果.json') + '</b>' +
                 '（' + (res.text.length / 1024).toFixed(0) + ' KB）', 'ok');
        });
      }).catch(function(e){
        expMsg('解密失败：' + esc(e && e.message ? e.message : e), 'bad');
      }).then(function(){ imp.value = ''; });
    };

    var cp = document.getElementById('expCopy');
    if(cp) cp.onclick = function(){
      var r;
      try{ r = makeExport('txt'); }catch(e){ expMsg('复制失败：' + esc(e.message), 'bad'); return; }
      var done = function(ok){
        expMsg(ok ? ('已复制 ' + r.rows.toLocaleString() + ' 条到剪贴板' +
                     (r.masked ? '（' + maskSummary() + '）' : ''))
                  : '浏览器拒绝了剪贴板写入，请改用上面的「纯文本」导出下载。',
               ok ? 'ok' : 'bad');
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(r.text).then(function(){ done(true); }, function(){ done(false); });
      } else {
        try{
          var ta = document.createElement('textarea');
          ta.value = r.text;
          ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          done(ok);
        }catch(e){ done(false); }
      }
    };
  })();

  /* 打开导出 / 高级筛选折叠时刷新一下计数 */
  ['advFold', 'expFold'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.addEventListener('toggle', function(){ updateExpCnt(); updateAdvCnt(); });
  });
  updateExpCnt();

  /* ---------- 本次 boot 的收尾 ---------- */
  updateAutoChip();
  applyFilter();
  st.win = Math.max(0, st.list.length - CHUNK);
  render();
  highlightMonth(st.list.length - 1);
  requestAnimationFrame(function(){ window.scrollTo(0, document.body.scrollHeight); });
}

/* ---------- 顶部「微博 / B站 / …」切换 ----------
   按钮完全由会话清单渲染：sessions.json 里加一个会话，
   这里就自动多一个按钮，不需要改 HTML。 */
function bindSrcSwitch(){
  var box = document.getElementById('srcSw');
  if(!box) return;

  box.innerHTML = '';
  SESSION_ORDER.forEach(function(key){
    if(!SOURCES[key]) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.dataset.src = key;
    b.textContent = SOURCES[key].label;
    box.appendChild(b);
  });

  Array.prototype.forEach.call(box.querySelectorAll('button[data-src]'), function(b){
    var key = b.dataset.src, S = SOURCES[key];
    var ok = !!(S && S.data);
    b.setAttribute('aria-pressed', key === CUR_SRC ? 'true' : 'false');
    // 数据还没生成时也保持可点：点进去会看到「该跑哪个更新」的引导，而不是一个点不动的灰按钮
    if(ok) b.removeAttribute('data-empty'); else b.setAttribute('data-empty', '1');
    if(ok && S.data.meta && S.data.meta.total != null){
      var nEl = document.createElement('span');
      nEl.className = 'n';
      nEl.textContent = S.data.meta.total.toLocaleString();
      b.appendChild(nEl);
    }
    b.onclick = function(){
      // 注意：这里不能用绑定时算好的 ok —— 数据缺失也要能点进去，
      // boot() 会渲染 SRC.empty 的引导（「该跑哪个更新」），否则按钮形同虚设。
      if(key === CUR_SRC || !SOURCES[key]) return;
      try{ localStorage.setItem('dm-src', key); }catch(e){}
      boot(key);
    };
  });
}

/* ---------- 首次进入：优先上次看过的那个来源 ---------- */
(function init(){
  var want = SESSION_ORDER[0] || 'weibo';
  try{ want = localStorage.getItem('dm-src') || want; }catch(e){}
  if(!SOURCES[want] || !SOURCES[want].data){
    // 上次看过的来源没有数据（还没备份过）→ 退到第一个有数据的；
    // 全都没有就停在第一个，让页面显示「该跑哪个更新」的引导
    var ready = SESSION_ORDER.filter(function(k){ return SOURCES[k] && SOURCES[k].data; });
    want = ready.length ? ready[0] : (SESSION_ORDER[0] || 'weibo');
  }
  boot(want);
})();
</script>
